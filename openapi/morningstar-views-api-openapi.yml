openapi: 3.2.0
info:
  title: Morningstar Views API
  version: v1
  x-refined-note:
  - x-changelog differs across the merged source definitions and was not carried
  description: 'Operations tagged Views across 3 of this provider''s published API definitions: morningstar-dws-investment-details-equities-openapi.json, morningstar-dws-investment-details-managed-investments-async-openapi.json, morningstar-dws-investment-details-managed-investments-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://www.us-api.morningstar.com
  description: Americas
- url: https://www.apac-api.morningstar.com
  description: APAC
- url: https://www.emea-api.morningstar.com
  description: EMEA
security:
- Bearer: []
tags:
- name: Views
paths:
  /direct-web-services/v1/investments/views:
    get:
      tags:
      - Views
      summary: List views
      description: Retrieve the list of data views your account is entitled to access, along with the corresponding `viewId` values required to request investment details.
      operationId: getViews
      responses:
        '200':
          $ref: '#/components/responses/ResponseListViews'
        '400':
          $ref: '#/components/responses/ResponseBadRequest'
        '500':
          $ref: '#/components/responses/ResponseInternalServerError'
    servers:
    - url: https://www.us-api.morningstar.com
      description: Americas
    - url: https://www.apac-api.morningstar.com
      description: APAC
    - url: https://www.emea-api.morningstar.com
      description: EMEA
  /direct-web-services/v1/investments/views/{viewId}:
    get:
      summary: Retrieve a view definition
      parameters:
      - name: viewId
        in: path
        required: true
        schema:
          type: string
      tags:
      - Views
      operationId: getView
      responses:
        '200':
          $ref: '#/components/responses/ResponseGetView'
        '400':
          $ref: '#/components/responses/ResponseBadRequest'
        '500':
          $ref: '#/components/responses/ResponseInternalServerError'
    servers:
    - url: https://www.us-api.morningstar.com
      description: Americas
    - url: https://www.apac-api.morningstar.com
      description: APAC
    - url: https://www.emea-api.morningstar.com
      description: EMEA
