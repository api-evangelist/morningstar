      title: OutputInvalidInvestments
    OutputViewId:
      title: OutputViewId
      type: string
      description: 'Identifier of an entitled view or dataset. Use this value as `viewId` in investment detail requests.

        '
      minLength: 1
      example: equity-short-interest
    OutputViewDefinition:
      title: OutputViewDefinition
      type: object
      description: Definition of a view, including the datapoints it contains.
      required:
      - id
      - dataPoints
      properties:
        id:
          $ref: '#/components/schemas/OutputViewId'
        dataPoints:
          type: array
          description: List of data points included in the view.
          items:
            $ref: '#/components/schemas/OutputViewDefinitionDataPoint'
      additionalProperties: false
    OutputMetadata:
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
          readOnly: true
        portfolioDate:
          type: string
          nullable: true
        portfolioCurrency:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutputMetadataMessages'
          nullable: true
      additionalProperties: false
      title: OutputMetadata
    OutputDataPointId:
      title: OutputDataPointId
      type: string
      description: Fully-qualified datapoint identifier.
      minLength: 1
      example: shortInterest.daysToCover
