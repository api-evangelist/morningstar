          type: number
          description: 'The aggregated value of 120-Month Alpha; is derived using all eligible companies who are constituents in the specified Morningstar Index. 120-Month Alpha: A measure of excess return of a company''s security over a 120-month period relative to the return of a benchmark index that is considered to represent the market''s movement as a whole. The alpha uses a company''s total return; including dividends; as input for the calculation.'
