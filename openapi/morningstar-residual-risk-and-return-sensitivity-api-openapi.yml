          nullable: true
      additionalProperties: false
      title: OutputMetadataMessages
    OutputDailyNonDividendResidualRiskAndReturnSensitivity:
      type: object
      properties:
        asOfDate:
          type: string
          description: The calendar date when the daily residual risk and return sensitivity data points are calculated
          nullable: true
        compareIndexId:
          type: string
          description: The Morningstar Index Id that is used as a benchmark for the residual risk and return sensitivity calculation of a company's security. The assigned index for each security is based on the security's trading exchange and/or country.
          nullable: true
        nonDividendAlpha1008Day:
          type: number
          description: A measure of excess return of a company's security over a 1008-day period relative to the return of a benchmark index that is considered to represent the market's movement as a whole. The non-dividend alpha is calculated on a daily basis and uses a company's price return; excluding dividends; as input for the calculation.
          format: double
          nullable: true
        nonDividendAlpha1260Day:
          type: number
          description: A measure of excess return of a company's security over a 1260-day period relative to the return of a benchmark index that is considered to represent the market's movement as a whole. The non-dividend alpha is calculated on a daily basis and uses a company's price return; excluding dividends; as input for the calculation.
