          format: double
          nullable: true
        nonDividendBeta1008Day:
          type: number
          description: 'A measure of the volatility; or systematic risk; of a company''s security over a 1008-day period in comparison to the market as a whole. The non-dividend beta is calculated on a daily basis and uses a company''s price return; excluding dividends; as input for the calculation: A beta of 1 indicates that the security''s price will move with the market;  A beta of less than 1 means that the security will be less volatile than the market; A beta of greater than 1 indicates that the security''s price will be more volatile than the market.'
