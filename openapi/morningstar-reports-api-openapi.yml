openapi: 3.0.1
info:
  version: 1.0.0
  title: Authorization Tokens Accounts Reports API
  description: 'Use the `oauth` endpoint to generate the secure, time-limited JSON Web Tokens (JWTs) used to authorize access to APIs and components.</br></br>

    To request a token, click Authorize and enter the following credentials:


    * Username - Your Client ID.

    * Password - Your Client Secret.'
servers:
- url: https://www.us-api.morningstar.com/token
  description: PROD US
- url: https://www.emea-api.morningstar.com/token
  description: PROD EMEA
- url: https://www.apac-api.morningstar.com/token
  description: PROD APAC
security:
- BasicAuth: []
tags:
- name: Reports
paths:
  /v1/reports/risks/{id}:
    get:
      tags:
      - Reports
      summary: Get a risk tolerance report in JSON format
      description: Get a client's risk tolerance report in JSON format.
      operationId: getRiskReportJson
      parameters:
      - name: Accept-Language
        in: header
        description: Specifies the locale.
        required: true
        schema:
          type: string
          enum:
          - en-US
          - en-CA
          - en-AU
          - en-GB
          - en-IN
          - fr-CA
        example: en-US
      - name: X-API-RequestId
        in: header
        description: Initial request identifier
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of response to query
        required: true
        schema:
          type: string
      - name: clientId
        in: query
        description: Unique identifier of a client
        required: true
        schema:
          type: string
      - name: ignoreSections
        in: query
        example:
        - YOUR_DIFFERENCES
        - FOOTNOTES
        description: "Determines the sections NOT to include in the report.If not specified, all the sections will be included. Multiple valuses must be comma-separated. Accepted values are:\n\n  * `RISK_TOLERANCE`\n  * `USING_YOUR_PROFILE`\n  * `RISK_TOLERANCE_SCORE`\n  * `RISK_GROUP`\n  * `YOUR_DIFFERENCES`\n  * `FOOTNOTES`\n"
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponsePayload'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '500':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
        '502':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse502'
  /v2/reports/risks:
    get:
      tags:
      - Reports
      summary: Get a client's most recent risk tolerance report
      description: "Get a client’s risk tolerance report based on the most recently submitted responses to the risk tolerance questionnaire. The report includes sections on:\n\n\n  * Risk tolerance score\n  * Risk group\n  * Differences\n  * How to use the report\n  * Footnotes\n\nIn the `ignoreSections` parameter, specify any sections you do not want returned in the response.\n"
      operationId: getRiskReports
      parameters:
      - name: Accept-Language
        in: header
        description: Specifies the locale.
        required: true
        schema:
          type: string
          enum:
          - en-US
          - en-CA
          - en-AU
          - en-GB
          - en-IN
          - fr-CA
        example: en-US
      - name: X-API-RequestId
        in: header
        description: Initial request identifier
        schema:
          type: string
      - name: clientId
        in: query
        description: Unique identifier of a client
        required: true
        schema:
          type: string
      - name: rtqType
        in: query
        description: 'Questionnaire type identifier.

          - `FM10S30` - 10 questions

          - `FM25V30`- 25 questions

          '
        required: false
        schema:
          type: string
          enum:
          - FM10S30
          - FM25V30
      - name: disclosureType
        in: query
        description: 'Indicates if disclosure is needed.

          - `1` - Include disclosure.

          - `2` - Do not include disclosure.

          '
        required: false
        schema:
          type: integer
          enum:
          - 1
          - 2
      - name: ignoreSections
        in: query
        example:
        - YOUR_DIFFERENCES
        - FOOTNOTES
        description: "Determines the sections NOT to include in the report.If not specified, all the sections will be included. Multiple valuses must be comma-separated. Accepted values are:\n\n  * `RISK_TOLERANCE`\n  * `USING_YOUR_PROFILE`\n  * `RISK_TOLERANCE_SCORE`\n  * `RISK_GROUP`\n  * `YOUR_DIFFERENCES`\n  * `FOOTNOTES`\n"
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponsePayload'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '500':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
        '502':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse502'
  /v2/reports/risks/{id}:
    get:
      tags:
      - Reports
      summary: Get a specific risk tolerance report for a client
      description: "Get a specific response to the risk tolerance questionnaire for a client. The report includes sections on:\n\n\n  * Risk tolerance score\n  * Risk group\n  * Differences\n  * How to use the report\n  * Footnotes\n\nIn the `ignoreSections` parameter, specify any sections you do not want returned in the response.\n"
      operationId: getRiskReportPDF
      parameters:
      - name: Accept-Language
        in: header
        description: Specifies the locale.
        required: true
        schema:
          type: string
          enum:
          - en-US
          - en-CA
          - en-AU
          - en-GB
          - en-IN
          - fr-CA
        example: en-US
      - name: X-API-RequestId
        in: header
        description: Initial request identifier
        schema:
          type: string
      - name: id
        in: path
        description: Unique identifier of response to query
        required: true
        schema:
          type: string
      - name: clientId
        in: query
        description: Unique identifier of a client
        required: true
        schema:
          type: string
      - name: rtqType
        in: query
        description: 'Questionnaire type identifier.

          - `FM10S30` - 10 questions

          - `FM25V30`- 25 questions

          '
        required: false
        schema:
          type: string
          enum:
          - FM10S30
          - FM25V30
      - name: disclosureType
        in: query
        description: 'Indicates if disclosure is needed.

          - `1` - Include disclosure.

          - `2` - Do not include disclosure.

          '
        required: false
        schema:
          type: integer
          enum:
          - 1
          - 2
      - name: ignoreSections
        in: query
        example:
        - YOUR_DIFFERENCES
        - FOOTNOTES
        description: "Determines the sections NOT to include in the report.If not specified, all the sections will be included. Multiple valuses must be comma-separated. Accepted values are:\n\n  * `RISK_TOLERANCE`\n  * `USING_YOUR_PROFILE`\n  * `RISK_TOLERANCE_SCORE`\n  * `RISK_GROUP`\n  * `YOUR_DIFFERENCES`\n  * `FOOTNOTES`\n"
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponsePayload'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '500':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
        '502':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse502'
  /report:
    post:
      tags:
      - Reports
      summary: Generate reports
      description: 'Create a report for the portfolio specified in the request body. Report types include: </br></br> - X-Ray</br>- Snapshot </br> - Hypothetical Growth </br>- Investment Details </br> - Stock Intersection </br>- Disclosure </br></br>To override the default value in the Accept-Language HTTP header, use the `langcult` parameter.'
      operationId: PortfolioAnalysisV1_PostAsync
      parameters:
      - name: langcult
        in: query
        description: Language and locale, for example, en-US
        required: false
        schema:
          type: string
          default: en-US
      - name: contentDispositionHeaderValue
        in: query
        description: Open PDF online or download as an attachment
        required: false
        schema:
          type: string
          default: attachment
          enum:
          - attachment
          - inline
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Input.PortfolioAnalysis.PortfolioAnalysisInputSettings'
          text/json:
            schema:
              $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Input.PortfolioAnalysis.PortfolioAnalysisInputSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Input.PortfolioAnalysis.PortfolioAnalysisInputSettings'
          application/xml:
            schema:
              $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Input.PortfolioAnalysis.PortfolioAnalysisInputSettings'
          text/xml:
            schema:
              $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Input.PortfolioAnalysis.PortfolioAnalysisInputSettings'
        description: Object that defines the settings and portfolio(s) to use in the request.
        required: true
      responses:
        '200':
          description: Success
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      deprecated: false
  /reports:
    get:
      tags:
      - Reports
      summary: Get report(s) metadata
      description: Get reports metadata including `reportId`. </br></br>You must enter a time period for the request to query in the `period` parameter. Time period is measured in quarters:</br> - `0` = Current quarter. For example, if today is 2021-07-31, returns reports for 2021-07-01 to 2021-09-30.</br> - `1` = Previous quarter. For example, if today is 2021-07-31, returns reports for 2021-04-01 to 2021-06-30.</br> - `n` = nth quarter from the current quarter. For example, `4` returns reports of the 4th quarter from the current quarter. If today is 2021-07-31, returns reports for 2020-07-01 to 2020-09-30.</br> - `-1` = Current and previous quarter. </br></br>You can limit results returned by entering a string in the `name` parameter. Only reports with that string in the report name will be returned. </br></br>You can also limit the results returned by specifying values in the `bucketId` and `householdId` parameters. </br></br>A value of `published` in the `published` parameter will return published files only. <br><br>**Note:** If `published` has a `published` or `unpublished` value, the bucket ID will be ignored, and the response will return reports from all buckets.
      operationId: getReports
      parameters:
      - in: header
        name: x-api-key
        description: Unique API key of a client
        required: true
        schema:
          type: string
      - name: period
        in: query
        description: Time period for reports in quarters:<br> 0 = Current quarter<br> 1 = Previous quarter<br> n = nth quarter from the current quarter<br> -1 = Current and previous quarter<br>
        required: false
        schema:
          default: 0
          type: integer
      - name: name
        in: query
        description: Name search string
        required: false
        schema:
          type: string
      - name: bucketId
        in: query
        description: Unique identifier of a bucket. Default is root bucket.
        required: false
        schema:
          type: string
          format: uuid
      - name: householdId
        in: query
        description: Unique identifier of a client
        required: false
        schema:
          type: string
          format: uuid
      - name: published
        in: query
        description: When set to `published` returns published reports only
        required: false
        schema:
          type: string
          default: all
          enum:
          - all
          - published
          - unpublished
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReportList'
        '400':
          description: Invalid status value
  /reports/{reportId}:
    get:
      tags:
      - Reports
      summary: Get a report
      description: Get the report specified in the `reportId` parameter.
      operationId: getReportDetails
      parameters:
      - in: header
        name: x-api-key
        description: Unique API key of a client
        required: true
        schema:
          type: string
      - name: reportId
        in: path
        description: Unique identifier of a report
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ReportListSingle'
        '400':
          description: Invalid parameter value
        '404':
          description: Not found
  /reports/assign:
    post:
      tags:
      - Reports
      summary: Assign report(s)
      description: Assign report(s) specified in the request body to household(s) specified in the request body.</br></br>You must assign a report to a household before it can be published.
      operationId: assignReport
      parameters:
      - in: header
        name: x-api-key
        description: Unique API key of a client
        required: true
        schema:
          type: string
      requestBody:
        description: Assign report(s) to household(s).
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInput'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assign'
        '400':
          description: Invalid parameter value
        '404':
          description: Not found
  /reports/publish:
    post:
      tags:
      - Reports
      summary: Publish or unpublish reports(s) to Client Web Portal
      description: Add or remove report files from the Client Web Portal. You must assign a report to a household before it can be published.</br></br>**Note:** Requests to unpublish a report that contain an identifier for a report that has not been published will fail.
      operationId: publishReport
      parameters:
      - in: header
        name: x-api-key
        description: Unique API key of a client
        required: true
        schema:
          type: string
      - in: query
        name: enabled
        description: Set report(s) to added (true) or removed (false).
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: List of report IDs to add to/remove from Client Web Portal.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrayOfReportUuid'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publish'
        '400':
          description: Invalid parameter value
        '404':
          description: Not found
  /reports/risks/{responseId}:
    get:
      summary: Get the content of a specific response to a questionnaire
      description: Get the content of a specific response to a questionnaire, including the static text, risk tolerance responses, and footnotes. In the `ignoreSections` parameter, specify any sections you do not want returned in the response.
      tags:
      - Reports
      operationId: getRiskReport
      parameters:
      - name: responseId
        in: path
        description: Unique identifier of a response to a questionnaire
        required: true
        example: 436c05d4-27b6-4a92-b7f1-5a829d55373a
        schema:
          type: string
      - name: clientId
        in: query
        description: Unique identifier of a client
        example: 3168dab3-4445-40c5-8295-5a816c6cd5de
        required: true
        schema:
          type: string
      - name: ignoreSections
        in: query
        description: Define the sections you do NOT want to include in the report. It must be a comma separated string with the specific sections to ignore in the response. If not specified, all the sections will be included.
        required: false
        example: RISK_TOLERANCE,USING_YOUR_PROFILE,RISK_TOLERANCE_SCORE,RISK_GROUP,YOUR_DIFFERENCES,FOOTNOTES
        schema:
          type: string
      - name: X-API-RequestId
        in: header
        description: Initial request identifier
        example: 436c05d4-27b6-4a92-b7f1-5a829d55373a
        required: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: Indicate the locale for the request. e.g. en-US, fr-CA
        required: true
        schema:
          type: string
          enum:
          - en-US
      - name: Authorization
        in: header
        description: Bearer access token authorization
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponsePayload_2'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '502':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse502'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
  /reports/data-points:
    get:
      summary: Extract clients data in csv format.
      description: Extract client data with questionnaire answers and suitability score calculations.
      tags:
      - Reports
      operationId: getDataPointReport
      parameters:
      - name: startDate
        in: query
        description: Date to start fetching records.
        example: '20200601'
        required: true
        schema:
          type: integer
      - name: endDate
        in: query
        description: Date to limit fetching record.
        example: '20200228'
        required: true
        schema:
          type: integer
      - name: X-API-RequestId
        in: header
        description: Initial request identifier
        example: 436c05d4-27b6-4a92-b7f1-5a829d55373a
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer access token authorization
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File download.
          content:
            application/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: attachment; filename=data-points-20200601-20200228.csv
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '502':
          description: Internal server communication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse502'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
  /v1/reports/{namespaces}:
    get:
      tags:
      - Reports
      summary: Generate reports in Excel format
      operationId: getStatisticsReports
      parameters:
      - name: namespaces
        description: Get statistics for a namespace or comma-separated list of namespaces
        in: path
        required: true
        schema:
          type: string
          example: abco.opp.screener,abco.opp.xray
      responses:
        '200':
          description: Excel report file containing monthly and quarterly usage stats and top security data
          content:
            application/vnd.ms-excel:
              schema:
                type: string
                format: base64
                example: SGVsbG8gV29ybGQ=
        '401':
          description: The user is not authorised to perform this operation
          content:
            application/json:
              schema:
                type: object
                description: Generic error object
                properties:
                  errorId:
                    type: string
                    format: uuid
                    example: 100380c0-8f94-11ea-bc55-0242ac130003
                  message:
                    type: string
                    example: An error occurred
        '404':
          description: The requested resource does not exist
          content:
            application/json:
              schema:
                type: object
                description: Generic error object
                properties:
                  errorId:
                    type: string
                    format: uuid
                    example: 100380c0-8f94-11ea-bc55-0242ac130003
                  message:
                    type: string
                    example: An error occurred
        '500':
          description: An unexpected error occured
          content:
            application/json:
              schema:
                type: object
                description: Generic error object
                properties:
                  errorId:
                    type: string
                    format: uuid
                    example: 100380c0-8f94-11ea-bc55-0242ac130003
                  message:
                    type: string
                    example: An error occurred
components:
  schemas:
    Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquitySector:
      type: object
      properties:
        Id:
          description: Possible values are GICS, Morningstar, or Institution defined Id
          type: string
        Portfolio:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquitySectorExposureItem'
        Benchmark:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquitySectorExposureItem'
        SecurityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquitySectorExposureItemSecurity'
    Morningstar.PortfolioAnalysis.Models.Output.XRay.Holdings.StockIntersection:
      type: object
      properties:
        IncludeIndex:
          type: boolean
        Stock:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Holdings.StockIntersectionItem'
        ConcentrationRatio:
          $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Holdings.StockIntersectionConcentrationRatio'
    Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.WorldRegions:
      type: object
      properties:
        Id:
          type: string
        Portfolio:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquityRegionExposureItem'
        Benchmark:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquityRegionExposureItem'
        SecurityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquityRegionExposureItemSecurity'
    AssetClassPayload:
      title: AssetClassPayload
      type: object
      properties:
        label:
          type: string
          description: Asset label
          example: US Stocks
        count:
          type: number
          description: Asset value
          example: 24
    MixInvestmentsHeader:
      title: MixInvestmentsHeader
      type: object
      properties:
        portfolio:
          type: string
          description: Header of the column for portfolio information.
          example: Portfolio
        highRisk:
          type: string
          description: Header of the column for high risk information.
          example: High Risk/Return %
        mediumRisk:
          type: string
          description: Header of the column for medium risk information.
          example: Medium Risk/Return %
        lowRisk:
          type: string
          description: Header of the column for low risk information.
          example: Low Risk/Return %
      description: Mix investments header
    Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.InvestmentStyle:
      type: object
      properties:
        AsOfDate:
          format: date-time
          type: string
        FixedIncomeStyle:
          $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.FixedIncomeStyle'
        EquityStyle:
          $ref: '#/components/schemas/Morningstar.PortfolioAnalysis.Models.Output.XRay.Analysis.EquityStyle'
    Morningstar.PortfolioAnalysis.Models.Output.Hypo.SecurityEndingMarketValueBreakdown:
      type: object
      properties:
        Principal:
          format: double
          type: number
        Income:
          format: double
          type: number
        CapGain:
          format: double
          type: number
    Report:
      type: object
      required:
      - id
      - name
      properties:
        reportId:
          type: string
          format: uuid
          example: ef11ef11-abcd-1234-0000-000000000000
        storageId:
          type: string
          format: uuid
