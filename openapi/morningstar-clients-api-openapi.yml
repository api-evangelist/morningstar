components:
  schemas:
    QuestionRequest:
      title: QuestionRequest
      type: object
      properties:
        answers:
          type: array
          items:
            type: string
            description: Answer unique identifier
            example: FM10-1-4
        id:
          type: string
          description: Question unique identifier
          example: FM10-1
    AssetClassPayload:
      title: AssetClassPayload
      type: object
      properties:
        label:
          type: string
          description: Asset label
          example: US Stocks
        count:
          type: number
          description: Asset value
          example: 24
    MixInvestmentsHeader:
      title: MixInvestmentsHeader
      type: object
      properties:
        portfolio:
          type: string
          description: Header of the column for portfolio information.
          example: Portfolio
        highRisk:
          type: string
          description: Header of the column for high risk information.
          example: High Risk/Return %
        mediumRisk:
          type: string
          description: Header of the column for medium risk information.
          example: Medium Risk/Return %
        lowRisk:
          type: string
          description: Header of the column for low risk information.
          example: Low Risk/Return %
      description: Mix investments header
    ExperienceRequest:
      type: object
      title: ExperienceRequest
      properties:
        clientId:
          type: string
          description: Client unique identifier
          example: 3168dab3-4445-40c5-8295-5a816c6cd5de
        advisorId:
          type: string
          description: Advisor identifier
          example: aa68dab3-4445-40c5-8295-5a816c6cd5de
        questionnaire:
          type: string
          description: Questionnaire unique identifier
          example: FM10S30
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionRequest'
          example:
          - id: FM10-1
            answers:
            - FM10-1-1
          - id: FM10-2
            answers:
            - FM10-2-4
          - id: FM10-3
            answers:
            - FM10-3-1
          - id: FM10-4
            answers:
            - FM10-4-4
          - id: FM10-5
            answers:
            - FM10-5-1
          - id: FM10-6
            answers:
            - FM10-6-5
          - id: FM10-7
            answers:
            - FM10-7-1
          - id: FM10-8
            answers:
            - FM10-8-7
          - id: FM10-9
            answers:
            - FM10-9-1
          - id: FM10-10
            answers:
            - FM10-10-6
