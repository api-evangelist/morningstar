          type: string
          description: Client unique identifier. Optional
          example: 3168dab3-4445-40c5-8295-5a816c6cd5de
        timeHorizon:
          type: integer
          example: 3
          description: Time Horizon in years, When do you expect to need to withdraw a significant part (1/3 or more) of the money in your investment portfolio?
