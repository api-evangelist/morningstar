openapi: 3.0.1
info:
  version: 1.0.0
  title: Authorization Tokens Accounts Screener API
  description: 'Use the `oauth` endpoint to generate the secure, time-limited JSON Web Tokens (JWTs) used to authorize access to APIs and components.</br></br>

    To request a token, click Authorize and enter the following credentials:


    * Username - Your Client ID.

    * Password - Your Client Secret.'
servers:
- url: https://www.us-api.morningstar.com/token
  description: PROD US
- url: https://www.emea-api.morningstar.com/token
  description: PROD EMEA
- url: https://www.apac-api.morningstar.com/token
  description: PROD APAC
security:
- BasicAuth: []
tags:
- name: Screener
paths:
  /direct-web-services/v1/screeners/equities:
    post:
      summary: Query equity investments and return selected data points.
      operationId: queryEquityInvestments
      tags:
      - Screener
      requestBody:
        $ref: '#/components/requestBodies/ScreenerRequest'
      responses:
        '200':
          $ref: '#/components/responses/ScreenerResponse'
        '400':
          $ref: '#/components/responses/ResponseStatus400ResponseScreener'
        '500':
          $ref: '#/components/responses/ResponseStatus500ResponseScreener'
  /direct-web-services/v1/screeners/managed-investments:
    post:
      summary: Query managed investments and return selected data points.
      operationId: queryManagedInvestments
      tags:
      - Screener
      description: Returns the investments that meet the conditions defined in the `queries` object. Returns `performanceId` by default and any other data points specified in the `dataPoints` array.
      requestBody:
        $ref: '#/components/requestBodies/RequestManagedInvestmentsScreener'
      responses:
        '200':
          $ref: '#/components/responses/ResponseManagedInvestmentsScreener'
        '400':
          $ref: '#/components/responses/ResponseStatus400Screener'
        '500':
          $ref: '#/components/responses/ResponseStatus500Screener'
  /screener:
    get:
      tags:
      - Screener
      summary: Get securites and associated data points
      description: Specify search and filter criteria to limit the number of results returned. You can define the format of the returned content - JSON or XML. </br></br>To override the default value in the Accept-Language HTTP header, use the `langcult` parameter.
      operationId: Screener_GetScreenerData
      parameters:
      - name: startIndex
        in: query
        description: Row to start query from. Zero-based index; first row is '0.'
        required: false
        schema:
          type: string
          default: '0'
      - name: securityType
        in: query
        description: Unique identifier of a security type
        required: false
        schema:
          type: string
          default: st
      - name: results
        in: query
        description: Maximum number of rows to return
        required: false
        schema:
          type: string
          default: '10'
      - name: sort
        in: query
        description: Sort by data point
        required: false
        schema:
          type: string
          default: secId
      - name: dir
        in: query
        description: Sort results in ascending/descending direction
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      - name: output
        in: query
        description: Format of the returned content
        required: false
        schema:
          type: string
          default: json
          enum:
          - json
          - xml
      - name: langcult
        in: query
        description: Language and locale, for example, en-US
        required: false
        schema:
          type: string
          default: en-US
      - name: universe
        in: query
        description: Unique identifier of a universe
        required: false
        schema:
          type: string
          default: STGLOBAL
      - name: securityDataPoints
        in: query
        description: Unique identifier of a data point. Can be data point ID or short ID. Multiple values must be pipe-separated.
        required: false
        schema:
          type: string
          default: secId|selected|name|ticker
      - name: filters
        in: query
        description: Data point ID with either min/max values, or a list of specific values. Multiple criteria must be comma-separated.
        required: false
        example: fundSize:{"min":"100000000","max":"500000000"},starRating:[4,5]}
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    post:
      tags:
      - Screener
      summary: Create security and associated data points
      operationId: Screener_PostScreenerData
      parameters:
      - name: securityDataPoints
        in: query
        description: Unique identifier of a data point. Can be data point ID or short ID. Multiple values must be pipe-separated.
        required: false
        schema:
          type: string
          default: secId|selected|name|ticker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenerData'
          text/json:
            schema:
              $ref: '#/components/schemas/ScreenerData'
          application/xml:
            schema:
              $ref: '#/components/schemas/ScreenerData'
          text/xml:
            schema:
              $ref: '#/components/schemas/ScreenerData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScreenerData'
        description: Data fields to return
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
