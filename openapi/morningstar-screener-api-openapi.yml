    InputSort:
      title: InputSort
      description: Specifies the data points(s) to sort results by and sets the sort direction. If multiple data points are provided, they are applied in the order listed in the array (the first item is the primary sort key, the second is the secondary key, and so on.
      type: object
      properties:
        dataPoint:
          description: Specifies the data point used to sort results.
          example: basicReference.investmentType
          default: instrumentIdentifiers.performanceId
          type: string
          nullable: true
        orderBy:
          description: Sets the sort order.
          type: string
          enum:
          - asc
          - desc
          x-enum-description:
          - asc (Ascending)
          - desc (Descending)
          default: asc
          example: desc
      additionalProperties: false
    InputQueryOptions:
      title: InputQueryOptions
      description: 'Filters investments using `field:value` conditions or compound logic. For example:

        * Basic query - "equals": `{ "shareClassInformation.symbol": "MSES" }`

        * Basic query - "in": `{ "shareClassInformation.symbol": ["MSES", "CA40"] }`

        * Basic query - "range": `{ "marketCapital.asOfDate": { "gt": "2020-01-01", "lt": "2024-01-01" } }`

        * Compound query: `{ "and": [ { "field1": "value1" }, { "field2": "value2" } ] }`

        * Nested compound query: `{ "or": [ { "and": [ ... ] }, { "field": "value" } ] }`'
      type: object
      properties:
        and:
          description: All conditions must match (logical AND). Each element is an `InputQueryOptions` object and may itself contain nested `and`, `or`, or `not` logic.
          type: array
          items:
            $ref: '#/components/schemas/InputQueryOptions'
        or:
          description: At least one condition must match (logical OR). Each element is an `InputQueryOptions` object and may itself contain nested `and`, `or`, or `not` logic.
          type: array
          items:
            $ref: '#/components/schemas/InputQueryOptions'
        not:
          description: All conditions must not match (logical NOT). Each element is an `InputQueryOptions` object and may itself contain nested `and`, `or`, or `not` logic.
          type: array
          items:
            $ref: '#/components/schemas/InputQueryOptions'
      additionalProperties:
        $ref: '#/components/schemas/InputFilterOptions'
      propertyNames:
        description: Data points supported for filtering and sorting in screener queries. Retrieve valid values programmatically via `GET /direct-web-services/v1/screeners/equities/data-points`, or browse the full reference in the data dictionary.
        type: string
        example: companyInformation.domicileCountryCode
        externalDocs:
          description: Data dictionary (Excel)
          url: https://developer.morningstar.com/content/hidden-from-navigation/ScreenerEquitiesDataDictionary.xlsx
    InputFieldValueFilter:
      title: InputFieldValueFilter
      description: Filters for exact matches to value or a match to a value in a list. Supports string, number, integer, boolean, date and array data types.
      anyOf:
      - type: string
      - type: number
      - type: integer
      - type: boolean
      - type: string
        format: date
      - type: array
        minItems: 1
        items:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
          - type: string
            format: date
    OutputInvestment:
      title: OutputInvestment
      description: Data points and corresponding values returned for each result. Keys are data point names in the format `<dataGroup>.<fieldName>`. Values may be string, number, integer, or boolean depending on the data point. Use the discovery endpoint to determine the type for each data point.
      type: object
      additionalProperties:
        oneOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
        nullable: true
      example:
        instrumentIdentifiers.performanceId: 0P0001VK71
        shareClassInformation.symbol: MSES
        shareClassInformation.investmentStatus: 1
        marketCapital.asOfDate: '2025-10-02'
        marketCapital.companyLevelMarketCapital: 145230000
        trailingReturn.trailing1YearReturn: 12.45
        esgCompanyLevel2DataCarbonEmissions.carbonIntensity: 92.8
        companyInformation.sic: 6719
    InputPaginationOptions_2:
      title: InputPaginationOptions
      description: Determines how results are paginated.
      type: object
