  schemas:
    InputFilterOptions:
      title: InputFilterOptions
      description: Supported operators for data point filtering.
      oneOf:
      - $ref: '#/components/schemas/InputFieldValueFilter'
      - $ref: '#/components/schemas/InputFieldValueFilterFuzzy'
      - $ref: '#/components/schemas/InputFieldValueComparitorFilter'
    InputSortOption:
      title: InputSortOption
      description: The data point and sort direction. The data point must correspond to a value passed in the `dataPoints` array.
      type: object
      properties:
        dataPoint:
          description: Data point name.
          example: shareClassInformation.exchangeCode
          default: performanceId
          type: string
          nullable: true
        orderBy:
          description: Sort direction.
          type: string
          enum:
          - asc
          - desc
          x-enumDescriptions:
          - asc (Ascending)
          - desc (Descending)
          default: asc
          example: desc
      additionalProperties: false
    InputFieldValueComparitorFilter:
      title: InputFieldValueComparitorFilter
      description: Filters for values within a range or based on a comparator condition. Supports numeric, integer, and date string data types.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        gt:
          description: Greater than
          anyOf:
          - type: number
          - type: integer
          - type: string
            format: date
        gte:
          description: Greater than or equal
          anyOf:
          - type: number
          - type: integer
          - type: string
            format: date
        lt:
          description: Less than
          anyOf:
          - type: number
          - type: integer
          - type: string
            format: date
        lte:
          description: Less than or equal
          anyOf:
          - type: number
          - type: integer
          - type: string
            format: date
    OutputError:
      title: OutputError
      description: Error message and status code.
      type: object
      properties:
        statusCode:
          type: string
          description: Indicates the HTTP status code.
          example: 400
        errorCode:
          type: string
          description: Indicates the unique error identifier.
          example: 400.screener.006
        message:
          type: string
          description: Description of the errror.
          example: Please provide valid sort option.
        requestId:
          type: string
          description: Indicates the unique request identifier.
          example: 6631c374-2331-4c7e-b6f2-d0c0079f6ee
      additionalProperties: false
    RequestEquitiesScreener:
      title: RequestEquitiesScreener
      description: Screener request body. All fields are optional, however either `scope` or `query` must be provided.
      type: object
      properties:
        scope:
          description: "Defines the starting universe of investments. For equities, the scoping data point is `shareClassInformation.exchangeCode`. \nCompound and nested compound queries are supported. Each branch of the query must contain the scoping data point."
          $ref: '#/components/schemas/InputQueryOptions'
        query:
          $ref: '#/components/schemas/InputQueryOptions'
        dataPoints:
          $ref: '#/components/schemas/InputDataPoints'
        pagination:
          $ref: '#/components/schemas/InputPaginationOptions'
        sort:
          description: 'Specifies one or more data points to sort results by. If multiple values are provided, they are applied in the order listed in the array (the first value is the primary sort key, the second value is the secondary key, and so on).

            Data points specified must correspond to a value passed in the `dataPoints` array.

            If not provided, results will be sorted by `investmentIdentfiers.performanceId`.'
          type: array
          items:
            $ref: '#/components/schemas/InputSortOption'
          nullable: true
        languageId:
          description: Specifies the language code used to filter language-dependent results.
          type: string
          default: ENG
          example: JPN
          enum:
          - ARA
          - CHI
          - DAN
          - DUT
          - ENG
          - FIN
          - FRE
          - GER
          - HEB
          - ITA
          - JPN
          - KOR
          - NOR
          - POR
          - SPA
          - SWE
          - THA
          - ZHO
          x-enumDescriptions:
          - ARA (Arabic)
          - CHI or ZHO (Chinese)
          - DAN (Danish)
          - DUT (Dutch)
          - ENG (English)
          - FIN (Finnish)
          - FRE (French)
          - GER (German)
          - HEB (Hebrew)
          - ITA (Italian)
          - JPN (Japanese)
          - KOR (Korean)
          - NOR (Norwegian)
          - POR (Portuguese)
          - SPA (Spanish)
          - SWE (Swedish)
          - THA (Thai)
          nullable: true
        currencyId:
          description: Specifies the currency code used to filter currency-dependent results. Accepts ISO 4217 currency codes.
          type: string
          example: EUR
          default: USD
          nullable: true
      additionalProperties: false
    InputQueryOptions_2:
      title: InputQueryOptions
      description: 'Filters investments using `field:value` conditions or compound logic. For example:

        * Basic query - "equals": `{ "basicReference.baseCurrency": "USD" }`

        * Basic query - "in": `{ "basicReference.baseCurrency": ["USD", "GBP"] }`

        * Basic query - "range": `{ "basicReference.inceptionDate": { "gt": "2020-01-01", "lt": "2024-01-01" } }`

        * Compound query: `{ "and": [ { "field1": "value1" }, { "field2": "value2" } ] }`

        * Nested compound query: `{ "or": [ { "and": [ ... ] }, { "field": "value" } ] }`'
      type: object
      properties:
        and:
          description: All conditions must match (logical AND). Each element is an `InputQueryOptions` object and may itself contain nested `and`, `or`, or `not` logic.
          type: array
          items:
            $ref: '#/components/schemas/InputQueryOptions_2'
        or:
          description: At least one condition must match (logical OR). Each element is an `InputQueryOptions` object and may itself contain nested `and`, `or`, or `not` logic.
          type: array
          items:
            $ref: '#/components/schemas/InputQueryOptions_2'
        not:
          description: All conditions must not match (logical NOT). Each element is an `InputQueryOptions` object and may itself contain nested `and`, `or`, or `not` logic.
          type: array
          items:
            $ref: '#/components/schemas/InputQueryOptions_2'
      additionalProperties:
        $ref: '#/components/schemas/InputFilterOptions'
      propertyNames:
        description: Data points supported for filtering and sorting in screener queries. Retrieve valid values programmatically via `GET /direct-web-services/v1/screeners/managed-investments/data-points`, or browse the full reference in the data dictionary.
        type: string
        example: basicReference.legalName
        externalDocs:
          description: Data dictionary (Excel)
          url: https://developer.morningstar.com/content/hidden-from-navigation/ScreenerManagedInvestmentsDataDictionary.xlsx
    InputDataPoints:
      title: InputDataPoints
      description: Lists data points to return. Retrieve valid values programmatically via `GET /direct-web-services/v1/screeners/equities/data-points`, or browse the full reference in the data dictionary.
      type: array
      maxItems: 100
      items:
        type: string
      example:
      - companyInformation.cik
      - companyInformation.legalName
      - companyInformation.morningstarSectorCode
      - balanceSheet.totalAssetsValueFY
      - basicReference.isin
      externalDocs:
        description: Data dictionary (Excel)
        url: https://developer.morningstar.com/content/hidden-from-navigation/ScreenerEquitiesDataDictionary.xlsx
    OutputScreenerMetadata:
      description: Metadata returned in response to requests to `POST /screeners/equities` endpoint. Includes information about data points not returned for results.
