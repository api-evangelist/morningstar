    RequestManagedInvestmentsScreener:
      title: RequestManagedInvestmentsScreener
      description: Screener request body model.
      type: object
      required:
      - scope
      - query
      properties:
        scope:
          description: Defines the starting universe of investments. For managed investments, the scoping data point is `basicReference.countryAvailableForSale`. Compound and nested compound queries are supported. Each branch of the query must contain the scoping data point.
          $ref: '#/components/schemas/InputQueryOptions_2'
        query:
          $ref: '#/components/schemas/InputQueryOptions_2'
        dataPoints:
          $ref: '#/components/schemas/InputDataPoints_2'
        pagination:
          $ref: '#/components/schemas/InputPaginationOptions_2'
        sort:
          description: Specifies one or more fields to sort results by. If multiple fields are provided, they are applied in the order listed in the array (the first field is the primary sort key, the second is the secondary key, and so on).
          type: array
          items:
            $ref: '#/components/schemas/InputSort'
          nullable: true
        languageId:
          description: Specifies the language code used to filter language-dependent results.
          type: string
          default: ENG
          example: JPN
          enum:
          - ARA
          - CHI
          - DAN
          - DUT
          - ENG
          - FIN
          - FRE
          - GER
          - HEB
          - ITA
          - JPN
          - KOR
          - NOR
          - POR
          - SPA
          - SWE
          - THA
          - ZHO
          x-enum-description:
          - ARA (Arabic)
          - CHI or ZHO (Chinese)
          - DAN (Danish)
          - DUT (Dutch)
          - ENG (English)
          - FIN (Finnish)
          - FRE (French)
          - GER (German)
          - HEB (Hebrew)
          - ITA (Italian)
          - JPN (Japanese)
          - KOR (Korean)
          - NOR (Norwegian)
          - POR (Portuguese)
          - SPA (Spanish)
          - SWE (Swedish)
          - THA (Thai)
          nullable: true
        currencyId:
          description: Specifies the currency code used to filter currency-dependent results. Accepts ISO 4217 currency codes.
          type: string
          example: EUR
          default: USD
          nullable: true
      additionalProperties: false
