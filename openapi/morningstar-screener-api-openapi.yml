          description: Specifies the target of the next API call.
          type: string
          example: CJ2aBBoROg81YmFuYyBzcGxpdCBpbmMaDDoKMHAwMDAwbTJkaiIMOgowUDAwMDBNMkRK
          nullable: true
        paginationTokenPrevious:
          description: Specifies the target of the next API call.
          type: string
          example: CJ2aBBoROg81YmFuYyBzcGxpdCBpbmMaDDoKMHAwMDAwbTJkaiIMOgowUDAwMDBNMkRK
          nullable: true
        pageSize:
          description: Specifies the maximum number of results per page. The default value is 50.
          type: integer
          format: int32
          example: 500
          default: 50
          maximum: 50
      additionalProperties: false
    InputPaginationOptions:
      title: InputPaginationOptions
      description: Determines how results are paginated.
      type: object
      properties:
        paginationTokenNext:
          description: Specifies the target of the next API call.
          type: string
          example: CJ2aBBoROg81YmFuYyBzcGxpdCBpbmMaDDoKMHAwMDAwbTJkaiIMOgowUDAwMDBNMkRK
