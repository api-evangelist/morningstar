          format: double
          nullable: true
        tier1CapitalValue:
          type: number
          description: Tier 1 capital; used to describe the capital adequacy of a bank; is core capital that includes equity capital and disclosed reserves. The Tier 1 Capital ratio compares a bank's equity capital to its total risk weighted assets. Risk weighted assets are all assets held by a bank that are weighted by credit risk. Most central banks set formulas for asset risk weights according to the Basel Committee's guidelines.
          format: double
          nullable: true
        tier1LeverageRatioValue:
