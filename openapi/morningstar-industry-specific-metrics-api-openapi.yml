          format: double
          nullable: true
        tier2CapitalRatioValue:
          type: number
          description: The tier 2 capital ratio comes by dividing tier 2 capital with total risk-weighted assets.
          format: double
          nullable: true
        tier2CapitalValue:
          type: number
          description: Tier 2 capital is designated as supplementary capital; and is composed of items such as revaluation reserves; undisclosed reserves; hybrid instruments and subordinated term debt.
          format: double
          nullable: true
        totalCapitalRatioValue:
          type: number
          description: The ratio of Total capital to risk weighted assets.
          format: double
          nullable: true
        totalCapitalValue:
          type: number
          description: Total capital is Tier 1 equity capital; consisting of equity capital; disclosed reserves and Tier 2 capital; made up of revaluation reserves; undisclosed reserves; hybrid instruments and subordinated term debt
