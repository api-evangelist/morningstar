          type: number
          description: Generic stress test that aims to anticipate market-wide shocks. The liquidity coverage ratio is designed to ensure financial institutions have the necessary assets on hand to ride out short-term liquidity disruptions.
          format: double
          nullable: true
        nonPerformingAssetsLoansValue:
          type: number
          description: Nonperforming asset (NPA) refers to a classification for loans on the books of financial institutions that are in default or are in arrears on scheduled payments of principal or interest. In most cases; debt is classified as nonperforming when loan payments have not been made for a period of 90 days. While 90 days of nonpayment is the standard period of time for debt to be categorized as nonperforming; the amount of elapsed time may be shorter or longer depending on the terms and conditions set forth in each loan.
          format: double
          nullable: true
