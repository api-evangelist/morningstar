    ResponsePortfolioHoldingsDates:
      type: object
      properties:
        portfolioDates:
          type: array
          items:
            $ref: '#/components/schemas/OutputPortfolioHoldingsDates'
          description: List of available portfolio dates
          nullable: true
        identifiers:
          $ref: '#/components/schemas/OutputIdentifiers'
        metadata:
          $ref: '#/components/schemas/OutputMetadata'
      additionalProperties: false
      description: Response model for portfolio holdings dates endpoint
      title: ResponsePortfolioHoldingsDates
    OutputCategory:
      title: OutputCategory
      type: string
      description: Identifies the thematic category or functional area a data point belongs to within the Time Series API.
      enum:
      - fees-expenses
      - corporate-actions
      - fund-sustainability
      - fund-research
      - performance
      - portfolio-analytics
      - portfolio-holdings
      - reference
    RequestPortfolioHoldingsDates:
      type: object
      properties:
        holdingsView:
          type: string
          description: Holdings view to retrieve. Allowed values are `10`, `25`, or `full`.
          nullable: true
          enum:
          - '10'
          - '25'
          - full
        type:
          type: string
          description: Type of portfolio dates to retrieve. Allowed values are `mostRecent`, `timeSeries`, or `staticDates`.
          nullable: true
          enum:
          - mostRecent
          - timeSeries
          - staticDates
        frequency:
          type: string
          description: Frequency used when `type` is `timeSeries`. Allowed values are `d` (daily) or `m` (monthly).
          nullable: true
          enum:
          - d
          - m
        startDate:
          type: string
          description: Start date in `YYYY-MM-DD` format. Required when `type` is `timeSeries`.
          nullable: true
        endDate:
          type: string
          description: End date in `YYYY-MM-DD` format. Required when `type` is `timeSeries`.
          nullable: true
        dates:
          type: array
          items:
            type: string
            minItems: 1
            maxItems: 10
          description: Array of dates in `YYYY-MM-DD` format. Required when `type` is `staticDates`. Maximum of 10 dates accepted.
          nullable: true
        idType:
          type: string
          description: Type of identifier provided in the `id` field.
          default: performanceId
          nullable: true
          enum:
          - performanceId
          - securityId
          - cusip
          - isin
          - sedol
          - tradingSymbol
          - fundCode
          - msid
          - ticker
        baseCurrency:
          type: string
          description: Base currency used to resolve the investment identifier.
          nullable: true
        domicile:
          type: string
          description: Domicile used to resolve the investment identifier.
          nullable: true
        exchangeCountry:
          type: string
          description: Exchange country used to resolve the investment identifier.
          nullable: true
        exchangeId:
          type: string
          description: Exchange identifier used to resolve the investment identifier.
          nullable: true
      additionalProperties: false
      description: Request model for portfolio holdings dates endpoint
      required:
      - holdingsView
      - type
      title: RequestPortfolioHoldingsDates
    OutputMetadata:
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
          readOnly: true
        portfolioDate:
          type: string
          nullable: true
        portfolioCurrency:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutputMetadataMessages'
          nullable: true
      additionalProperties: false
      title: OutputMetadata
      description: All fields are nullable. Empty or `null` value fields are not returned.
