components:
  schemas:
    OutputIdentifiers:
      type: object
      properties:
        performanceId:
          type: string
          nullable: true
        securityId:
          type: string
          nullable: true
        cusip:
          type: string
          nullable: true
        isin:
          type: string
          nullable: true
        sedol:
          type: string
          nullable: true
        tradingSymbol:
          type: string
          nullable: true
        fundCode:
          type: string
          nullable: true
        msid:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
      additionalProperties: false
      title: OutputIdentifiers
    OutputConversionRatioChangeLog:
      type: object
      properties:
        changeFrom:
          type: number
          description: The conversion ratio value of a security before the change.
          format: double
          nullable: true
        changeTo:
          type: number
          description: The conversion ratio value of a security after the change.
          format: double
          nullable: true
        totalSharesOutstandingDate:
          type: string
          description: The as of date of the total shares outstanding value
          nullable: true
      additionalProperties: false
      title: OutputConversionRatioChangeLog
    OutputDomicileCountryChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The effective date when the domicile country for the company was changed
          nullable: true
        changeFrom:
          type: string
          description: The domicile country that the company changes from
          nullable: true
        changeTo:
          type: string
          description: The domicile country that the company changes to
          nullable: true
      additionalProperties: false
      title: OutputDomicileCountryChangeLog
    OutputLegalNameChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The starting date that an associated data point value is applicable to.
          nullable: true
        changeFrom:
          type: string
          description: Company Legal Name before the change.
          nullable: true
        changeTo:
          type: string
          description: Compay Legal Name after the change.
          nullable: true
      additionalProperties: false
      title: OutputLegalNameChangeLog
    OutputDrRatioChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The as of date when the change of par ratio became effective.
          nullable: true
        changeFrom:
          type: number
          description: The conversion ratio value of a security before the change.
          format: double
          nullable: true
        changeTo:
          type: number
          description: The conversion ratio value of a security after the change.
          format: double
          nullable: true
      additionalProperties: false
      title: OutputDrRatioChangeLog
    OutputErrorDetails:
      type: object
      properties:
        statusCode:
          type: integer
          description: Status Code
          format: int32
        errorCode:
          type: string
          description: Custom error code
          nullable: true
        message:
          type: string
          description: Message
          nullable: true
        requestId:
          type: string
          description: RequestId
          nullable: true
      additionalProperties: false
      description: Error details
      title: OutputErrorDetails
    OutputExchangeCodeChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The effective date when the exchange code for the share class was changed
          nullable: true
        changeFrom:
          type: string
          description: The exchange code that the share class changes from
          nullable: true
        changeTo:
          type: string
          description: The exchange code that the share class changes to
          nullable: true
      additionalProperties: false
      title: OutputExchangeCodeChangeLog
    OutputSymbolChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The effective date when the symbol for the share class was changed
          nullable: true
        changeFrom:
          type: string
          description: The symbol that the share class changes from
          nullable: true
        changeTo:
          type: string
          description: The symbol that the share class changes to
          nullable: true
      additionalProperties: false
      title: OutputSymbolChangeLog
    OutputMetadata:
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
          readOnly: true
        portfolioDate:
          type: string
          nullable: true
        portfolioCurrency:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutputMetadataMessages'
          nullable: true
      additionalProperties: false
      title: OutputMetadata
    OutputCentralIndexKeyChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The effective date when the company status was changed
          nullable: true
        changeFrom:
          type: string
          description: The status that the company changes from
          nullable: true
        changeTo:
          type: string
          description: The status that the company changes to
          nullable: true
      additionalProperties: false
      title: OutputCentralIndexKeyChangeLog
    OutputInvalidInvestments:
      type: object
      properties:
        id:
          type: string
          nullable: true
        idType:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        datapointId:
          type: array
          items:
            type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        performanceId:
          type: string
          description: Performance ID (if not passed in request).
          nullable: true
        companyId:
          type: string
          description: Company ID (if not passed in request).
          nullable: true
        baseCurrency:
          type: string
          description: Input base currency used to look up Investment identifier
          nullable: true
        domicile:
          type: string
          description: Input domicile used to look up Investment identifier.
          nullable: true
        exchangeCountry:
          type: string
          description: Input exchange country used to look up Investment identifier.
          nullable: true
        exchangeId:
          type: string
          description: Input exchange id used to look up Investment identifier.
          nullable: true
      additionalProperties: false
      title: OutputInvalidInvestments
    OutputIsinChangeLog:
      type: object
      properties:
        effectiveDate:
          type: string
          description: The effective date when the ISIN for the share class was changed
          nullable: true
        changeFrom:
          type: string
          description: The ISIN that the share class changes from
          nullable: true
        changeTo:
          type: string
          description: The ISIN that the share class changes to
          nullable: true
      additionalProperties: false
      title: OutputIsinChangeLog
    OutputMetadataMessages:
      type: object
      properties:
        type:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        investments:
          type: array
          items:
            $ref: '#/components/schemas/OutputInvalidInvestments'
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
      title: OutputMetadataMessages
    OutputEntityReferenceEntityNameChange:
      type: object
      properties:
        effectiveDate:
          type: string
          description: Effective date is the date on which the company name comes into existence as approved by the firm.
          nullable: true
        changeFrom:
          type: string
          description: The English translation of the foreign legal name if/when applicable
          nullable: true
        changeTo:
          type: string
          description: The English translation of the foreign legal name if/when applicable
          nullable: true
      additionalProperties: false
      title: OutputEntityReferenceEntityNameChange
  responses:
    ResponseInternalServerError:
      description: Internal Server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutputErrorDetails'
    ResponseBadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutputErrorDetails'
    ResponseEquitySecurityLevelReferenceChange:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              conversionRatioChangeLog:
                $ref: '#/components/schemas/OutputConversionRatioChangeLog'
              drRatioChangeLog:
                $ref: '#/components/schemas/OutputDrRatioChangeLog'
              exchangeCodeChangeLog:
                $ref: '#/components/schemas/OutputExchangeCodeChangeLog'
              symbolChangeLog:
                $ref: '#/components/schemas/OutputSymbolChangeLog'
              identifiers:
                $ref: '#/components/schemas/OutputIdentifiers'
              metadata:
                $ref: '#/components/schemas/OutputMetadata'
    ResponseEquityCompanyLevelReferenceChange:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              centralIndexKeyChangeLog:
                $ref: '#/components/schemas/OutputCentralIndexKeyChangeLog'
              domicileCountryChangeLog:
                $ref: '#/components/schemas/OutputDomicileCountryChangeLog'
              entityReferenceEntityNameChange:
                $ref: '#/components/schemas/OutputEntityReferenceEntityNameChange'
              legalNameChangeLog:
                $ref: '#/components/schemas/OutputLegalNameChangeLog'
              identifiers:
                $ref: '#/components/schemas/OutputIdentifiers'
              metadata:
                $ref: '#/components/schemas/OutputMetadata'
    ResponseEquityReferenceChange:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              isinChangeLog:
                $ref: '#/components/schemas/OutputIsinChangeLog'
              conversionRatioChangeLog:
                $ref: '#/components/schemas/OutputConversionRatioChangeLog'
              drRatioChangeLog:
                $ref: '#/components/schemas/OutputDrRatioChangeLog'
              exchangeCodeChangeLog:
                $ref: '#/components/schemas/OutputExchangeCodeChangeLog'
              symbolChangeLog:
