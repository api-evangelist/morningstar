          enum:
          - Monthly
          type: string
          description: Frequency of the chart data points.
        Portfolio:
          $ref: '#/components/schemas/OutputHypoPortfolioSummaryChartItem'
          description: Time-series growth values for the portfolio.
        Benchmark:
          $ref: '#/components/schemas/OutputHypoPortfolioSummaryChartItem'
          description: Time-series growth values for the benchmark.
        NetAmountInvested:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemString'
          description: Time-series net amount invested values.
      description: Time-series data for rendering the portfolio growth chart.
    OutputHypoPlanningAssumptions:
      type: object
      properties:
        Currency:
          enum:
          - AUD
          - CAD
          - CNY
          - EUR
          - GBP
          - INR
          - JPY
          - USD
          type: string
          description: Currency of the portfolio output values. ISO alpha-3 currency code.
        RebalanceFrequency:
          enum:
          - Monthly
          - Quarterly
          - SemiAnnually
          - Annually
          - Biennially
          - None
          type: string
          description: Frequency at which the portfolio is rebalanced.
        IllustrationTrailingTimePeriod:
          default: YearToDate
          enum:
          - YearToDate
          - Year1
          - Year3
          - Year5
          - Year10
          - SinceInception
          - EarliestAvailable
          - EarliestCommon
          - Customized
          type: string
          description: Time period used to determine the start and end dates of the illustration.
        RebalanceThreshold:
          format: double
          type: number
          description: Minimum allocation drift (in percentage points) that triggers a rebalance. For example, `5` means rebalancing occurs only when a holding drifts 5% or more from its target.
        AllocationUpdateFrequency:
          enum:
          - Monthly
          - Quarterly
          - SemiAnnually
          - Annually
          - None
          type: string
          description: Frequency at which the target allocation is updated.
        FederalIncomeTaxRate:
          format: double
          type: number
          description: Federal income tax rate applied in the calculation, based on filing status and taxable income.
        CapitalGainTaxRate:
          format: double
          type: number
          description: Long-term capital gains tax rate applied in the calculation, based on filing status and taxable income.
        StateIncomeTaxRate:
          format: double
          type: number
          description: State income tax rate applied in the calculation.
        CanadianIncomeMarginalTaxRate:
          format: double
          type: number
          description: Canadian income marginal tax rate applied in the calculation. Canada only.
        CanadianDividendMarginalTaxRate:
          format: double
          type: number
          description: Canadian dividend marginal tax rate applied in the calculation. Canada only.
        CanadianCapitalGainsMarginalTaxRate:
          format: double
          type: number
          description: Canadian capital gains marginal tax rate applied in the calculation. Canada only.
        PayTaxes:
          enum:
          - OutOfPocket
          - SalesOfShares
          type: string
          description: How taxes are paid — either out of pocket or by selling shares.
        PayFees:
          enum:
          - OutOfPocket
          - SalesOfShares
          type: string
          description: How fees are paid — either out of pocket or by selling shares.
      description: Summary of the planning assumptions used in the hypothetical calculation.
    OutputHypoMedianReturnDataItem:
      type: object
      properties:
        Id:
          format: int32
          type: integer
          description: Sequential period identifier (1-based).
        Value:
          format: double
          type: number
          description: Return value for the period.
      description: A single period return data point.
  examples:
    RequestHypoExample1:
      summary: Request-Level HypoCalculationSettings
      value:
        View:
          Id: Growth
        RequestSettings:
          OutputCurrency: USD
          AssetClassGroupConfig:
            AssetClassGroupConfigs:
            - id: ACG-USBROAD
          HypoCalculationSettings:
            HypoType: Portfolio
            FilingStatus: NoTaxes
            TaxableIncome: 0
            PayTaxes: OutOfPocket
            FederalIncomeTaxRate: 0
            CapitalGainTaxRate: 0
            StateIncomeTaxRate: 0
            DividendTaxRate: 0
            IllustrationTrailingTimePeriod: YearToDate
            SynchronizePortfolioStartDate: false
            InvestmentDetailReturnsFrequency: Monthly
            LiquidateOnEndDate: false
            SubsequentInvestmentType: Invest
            SubsequentInvestmentAmount: 0
            SubsequentInvestmentWithdrawalFrequency: Monthly
            SubsequentInvestmentWithdrawalMonth: 3
            AssetBasedAnnualFee: 1.15
            AssetFeeFrequency: Monthly
            AssetFeeType: Percentage
            PayFees: OutOfPocketBeginning
            PayFeesUseCashFirst: false
            PortfolioAmountFee: 0
            FrontLoadType: Standard
            CustomFeeType: Amount
            SalesFeeAmount: 0
            ApplySalesCharge: false
            ApplyFeeForRebalance: false
            EntryExitFeeType: None
            RebalanceFrequency: Monthly
            RebalanceThreshold: 0
            ReinvestDividends: false
            ReinvestCapitalGains: false
            FeeSchedule:
              RecordKeepingFee:
              - Fee: 3.25
                FeeType: Percentage
                AccountValueFrom: 0
                AccountValueTo: 0
              AnnualMaintenanceFee:
              - Fee: 3.25
                FeeType: Percentage
                AccountValueFrom: 0
                AccountValueTo: 0
              QuarterlyFee:
              - Fee: 3.25
                FeeType: Percentage
                AccountValueFrom: 0
                AccountValueTo: 0
              AdvisoryFee:
              - Fee: 3.25
                FeeType: Percentage
                AccountValueFrom: 0
                AccountValueTo: 0
        Portfolios:
        - Name: string
          TotalValue: 20000
          Currency: USD
          Holdings:
          - SecurityId: FOUSA00DFS
            Weight: 100
            AssetBasedAnnualFee: 1.15
            AssetFeeFrequency: Monthly
            AssetFeeType: Percentage
            FrontLoadType: Standard
            LoadFeeType: Amount
            LoadFeeAmount: 0
  requestBodies:
    RequestHypotheticalPerformance:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestHypotheticalPerformance'
          examples:
            RequestHypoExample1:
              $ref: '#/components/examples/RequestHypoExample1'
  responses:
    ResponseHypotheticalPerformance:
      description: '200: OK'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseHypotheticalPerformance'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
