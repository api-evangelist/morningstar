        HighExt:
          type: number
          format: double
          description: High credit quality / Extensive duration.
        MedLtd:
          type: number
          format: double
          description: Medium credit quality / Limited duration.
        MedMod:
          type: number
          format: double
          description: Medium credit quality / Moderate duration.
        MedExt:
          type: number
          format: double
          description: Medium credit quality / Extensive duration.
        LowLtd:
          type: number
          format: double
          description: Low credit quality / Limited duration.
        LowMod:
          type: number
          format: double
          description: Low credit quality / Moderate duration.
        LowExt:
          type: number
          format: double
          description: Low credit quality / Extensive duration.
        Unclassified:
          type: number
          format: double
          description: Percentage not classified into a style box category.
    OutputRiskDownsideItems:
      description: Downside capture ratio — the portfolio's percentage capture of benchmark returns during periods when the benchmark was negative.
      type: object
      properties:
        TimePeriod:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemCaptureRatioTimePeriod'
    OutputGeometricAverageCapitalizationItem:
      type: object
      properties:
        Value:
          type: number
          format: double
          description: Geometric average capitalization value.
    OutputDataItemCaptureRatioTimePeriod:
      type: object
      properties:
        Id:
          type: string
          description: Time period identifier.
          enum:
          - Year1
          - Year3
          - Year5
          - Year10
        Value:
          type: number
          format: double
          description: Capture ratio value for the time period.
    OutputPerformanceCalendarYearReturn:
      type: object
      properties:
        CalendarYear:
          type: array
          description: Calendar year return data. Index 1–10 represents the 10 most recent calendar years.
          items:
            $ref: '#/components/schemas/OutputDataItemCalendarYearReturnTimePeriod'
    OutputRiskMPTStatisticsItem:
      type: object
      properties:
        Alpha:
          type: number
          format: double
          description: Difference between the portfolio's actual return and the return predicted by its beta. A positive alpha indicates outperformance.
        Beta:
          type: number
          format: double
          description: Measure of the portfolio's sensitivity to benchmark market movements.
        RSquared:
          type: number
          format: double
          description: Strength of the relationship between portfolio returns and benchmark returns. High values indicate close correlation.
        UpCaptureRatio:
          type: number
          format: double
          description: Percentage of benchmark upside returns captured by the portfolio during periods when the benchmark had positive returns.
        DownCaptureRatio:
          type: number
          format: double
          description: Percentage of benchmark downside returns captured by the portfolio during periods when the benchmark had negative returns.
        TreynorRatio:
          type: number
          format: double
          description: Risk-adjusted return measure using market risk (beta) rather than total risk (standard deviation).
        OmegaRatio:
          type: number
          format: double
          description: Risk-adjusted return measure that does not assume a normal return distribution, focusing on the likelihood of not meeting a target return.
    OutputXRaySecurityFeesSecurity:
      type: object
      properties:
        SecurityId:
          type: string
          description: Unique identifier of a security.
        FrontLoadFee:
          type: number
          format: double
          description: Front-end sales charge applied at the time of initial purchase, expressed as a percentage.
        DeferredLoadFee:
          type: number
          format: double
          description: Deferred sales charge assessed when shares are sold before a specified date.
        ManagementFees:
          type: number
          format: double
          description: Management and administrative fees paid by shareholders over the fund's prior fiscal year, taken from the fund's prospectus.
        Expense12b1:
          type: number
          format: double
          description: Annual marketing or distribution fee included in the fund expense ratio.
        GrossExpenseRatio:
          type: number
          format: double
          description: Annual fee charged to shareholders as a percentage of assets, covering all fund operating expenses including management, administrative, and 12b-1 fees.
    OutputDataItemStringNumber:
      type: object
      properties:
        Id:
          type: string
        Value:
          type: number
          format: double
          description: Value.
    OutputFixedIncomeSectors:
      description: The portfolio's fixed income exposure broken down by super sector. Percentages may reflect long, short, net, or long-rescaled positions.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        Id:
          type: string
          description: Fixed income sector identifier.
        Portfolio:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemStringNumber'
        Benchmark:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemStringNumber'
        SecurityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/OutputFixedIncomeSuperSectorDataBreakdown'
    OutputPerformanceRollingReturnsDetail:
      type: object
      properties:
        Id:
          type: integer
          format: int32
        Period:
          type: string
        CumulativeTotalReturn:
          type: number
          format: double
          description: Cumulative total return for the rolling period.
        AnnualizedTotalReturn:
          type: number
          format: double
          description: Annualized total return for the rolling period.
  examples:
    RequestPortfolioXrayExample2:
      summary: 'Request: Maximum Portfolios Input (2)'
      value:
        RequestSettings:
          OutputCurrency: USD
          AssetClassGroupConfig:
            AssetClassGroupConfigs:
            - id: ACG-USBROAD
          AnalysisDateTimePeriod: MonthEnd
          PortfolioPerformanceStartDate: EarliestCommon
          PerformanceFrequency: Monthly
          InitialValue: 10000
          SynchronizePortfolioStartDate: true
          ReturnDataSections:
          - RollingReturns
          RollingReturnFrequencies:
          - Year1
          - Year3
          - Year5
          RollingReturnStep: 1
          IncludePortfolioInCorrelationMatrix: false
        Portfolios:
        - Name: ExamplePortfolio1
          Currency: USD
          TotalValue: 50000
          Holdings:
          - TradingSymbol: AAPL
            Value: 15000
          - TradingSymbol: MSFT
            Value: 12000
          - TradingSymbol: AMZN
            Value: 10000
          - ISIN: US5949181045
            Value: 8000
          - TradingSymbol: NVDA
            Value: 5000
          Fees:
            AnnualFeePercent: 0.5
            AnnualFeeFrequency: Monthly
        - Name: ExamplePortfolio2
          Currency: USD
          TotalValue: 19500
          Holdings:
          - TradingSymbol: BND
            Value: 2000
          - TradingSymbol: VYM
            Value: 1500
          - CUSIP: '922908769'
            Value: 10000
          - SecurityId: CASH%0.000
            Value: 6000
    RequestPortfolioXrayExample1:
      summary: 'Request: Minimum Portfolios Input (1)'
      value:
        Portfolios:
        - Name: ExamplePortfolio1
          Currency: USD
          TotalValue: 50000
          Holdings:
          - TradingSymbol: SPY
            Weight: 40
          - TradingSymbol: AGG
            Weight: 30
          - TradingSymbol: QQQ
            Weight: 20
          - SecurityId: CASH%0.000
            Weight: 10
          Benchmark:
            Type: Standard
          RequestSettings:
            OutputCurrency: USD
            AnalysisDateTimePeriod: MonthEnd
            PortfolioPerformanceStartDate: EarliestCommon
            PerformanceFrequency: Monthly
            InitialValue: 10000
            DisableRescale: false
