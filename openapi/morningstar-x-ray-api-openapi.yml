    InputPortfolioHolding:
      description: 'Each holding requires a security identifier and a position size. For the identifier, pass one of: `SecurityId`, `CUSIP`, `FundCode`, `ISIN`, `PerformanceId`, or `TradingSymbol`. If multiple identifiers are provided for a single security, `SecurityId` takes priority; if `SecurityId` is absent, the last identifier listed in the object is used. For the position size, pass either of: `Weight` or `Value`.'
      type: object
      properties:
        SecurityId:
          description: Morningstar unique identifier of a security. Use `CASH%0.000` for cash positions.
          type: string
          examples:
          - FOUSA00DFS
          - CASH%0.000
        CUSIP:
          description: Security's CUSIP.
          type: string
          examples:
          - 09251T103
        ISIN:
          description: Security's ISIN.
          type: string
          examples:
          - US0378331005
        PerformanceId:
          description: Security's Morningstar Performance ID.
          type: string
          examples:
          - 0P00002QN3
        TradingSymbol:
          description: '"Security''s ticker/trading symbol."'
          type: string
          examples:
          - MDLOX
        FundCode:
          description: Security's fund code.
          type: string
          examples:
          - ABG
        Weight:
          description: Holding weight as a percentage of portfolio total. All holding weights must sum to 100.
          minimum: 1
          maximum: 100
          examples:
          - 60
          type: number
          format: double
        Value:
          description: Market value of the holding in the portfolio currency. Sum of all holdings must equal portfolio `TotalValue`.
          minimum: 1
          examples:
          - 25000
          type: number
          format: double
        AnnualFeeFrequency:
          description: How often the holding-level annual fee is deducted.
          default: Monthly
          type: string
          enum:
          - Monthly
          - Quarterly
          - SemiAnnually
          - Annually
        AnnualFeePercent:
          description: Holding-level annual fee as a percentage of holding value (e.g. `1.15` = 1.15%). Defaults to `0` (no fee).
          minimum: 0
          default: 0
          examples:
          - 1.15
          type: number
          format: double
