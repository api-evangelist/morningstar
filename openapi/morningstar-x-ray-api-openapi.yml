openapi: 3.0.1
info:
  version: 1.0.0
  title: Authorization Tokens Accounts X-Ray API
  description: 'Use the `oauth` endpoint to generate the secure, time-limited JSON Web Tokens (JWTs) used to authorize access to APIs and components.</br></br>

    To request a token, click Authorize and enter the following credentials:


    * Username - Your Client ID.

    * Password - Your Client Secret.'
servers:
- url: https://www.us-api.morningstar.com/token
  description: PROD US
- url: https://www.emea-api.morningstar.com/token
  description: PROD EMEA
- url: https://www.apac-api.morningstar.com/token
  description: PROD APAC
security:
- BasicAuth: []
tags:
- name: X-Ray
paths:
  /portfolioanalysis/v1/xray:
    post:
      tags:
      - X-Ray
      summary: Generate portfolio x-ray
      description: Generate an x-ray of the portfolio(s) specified in the request body. The response will return information about how the portfolio is diversified by region, sector and investment style.</br></br>To override the default value in the Accept-Language HTTP header, use the `langcult` parameter.
      operationId: generatePortfolioXRay
      parameters:
      - name: langcult
        in: query
        description: Language and locale used for the response. Defaults to en-US.
        required: true
        schema:
          type: string
          default: en-US
          enum:
          - en-US
          - en-CA
          - en-AU
          - en-GB
      requestBody:
        $ref: '#/components/requestBodies/RequestPortfolioXray'
      responses:
        '200':
          $ref: '#/components/responses/ResponsePortfolioXray'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputErrorOutput'
              examples:
                General - BadInput Output:
                  summary: General BadInput
                  value: '{"Message": "The request is invalid.","SpecificErrorStatus": [    {"ErrorCode": "40015","ErrorMessage": "Portfolio does not have any valid holdings. Invalid portfolio name: TestPortfolio1. Invalid Holdings: TradingSymbol:DODGX1."}]}'
                DisableRescaleTrue - BadInputOutput:
                  summary: DisableRescale BadInput
                  value: '{"Message": "The request is invalid.","SpecificErrorStatus": [    {"ErrorCode": "40059","ErrorMessage": "There are holdings present in portfolio which are invalid.","Metadata": {"InvalidPortfolios": [{    "Name": "Test Portfolio","InvalidHoldings": [{"SecurityId": "FX000015JA3","Status": "Invalid"},{"SecurityId": "F00000YZ48","Status": "Unentitled"}]}]}}]}'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '500':
          description: Internal Server Error
          content: {}
components:
  schemas:
    OutputInterestRateRiskItem:
      type: object
      properties:
        Maturity:
          type: number
          format: double
          description: Weighted average maturity of portfolio holdings.
        MaturityPercentAnalyzed:
          type: number
          format: double
          description: Percentage of portfolio maturity analyzed.
        YieldToMaturity:
          type: number
          format: double
          description: Holding-weighted average yield of all applicable holdings. Ignores the impact of option features such as calls or puts.
        ModifiedDuration:
          type: number
          format: double
          description: Holding-weighted average price sensitivity to interest rate changes, excluding the impact of option features. Expressed in years.
        EffectiveDuration:
          type: number
          format: double
          description: Holding-weighted average price sensitivity to interest rate changes, including the impact of option features. Expressed in years.
        EffectiveDurationPercentAnalyzed:
          type: number
          format: double
          description: Percentage of portfolio effective duration analyzed.
        WTDCoupon:
          type: number
          format: double
        WTDPrice:
          type: number
          format: double
        AverageCreditQuality:
          type: number
          format: double
          description: Morningstar proprietary measure of overall portfolio credit risk, derived from historical default rates associated with each credit rating level.
    OutputPerformanceRollingReturns:
      description: Rolling return data for the portfolio.
      type: object
      properties:
        RollingReturn:
          type: array
          items:
            $ref: '#/components/schemas/OutputPerformanceRollingReturn'
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
    OutputCreditQuality:
      description: The percentage of the portfolio's fixed income holdings assigned to each credit quality rating band.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        Portfolio:
          $ref: '#/components/schemas/OutputCreditQualityItem'
        Benchmark:
          $ref: '#/components/schemas/OutputCreditQualityItem'
    OutputXRayHoldingsTopNetUnderlyingHoldings:
      description: Top net underlying holdings data.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        TopNumber:
          type: integer
          format: int32
          description: Number of top holdings returned.
        Security:
          type: array
          items:
            $ref: '#/components/schemas/OutputXRayHoldingsTopNetUnderlyingHoldingsSecurity'
    OutputEquityMarketMaturity:
      description: Market maturity breakdown showing the percentage of portfolio stocks domiciled in developed and emerging markets.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        Portfolio:
          $ref: '#/components/schemas/OutputEquityMarketMaturityItem'
        Benchmark:
          $ref: '#/components/schemas/OutputEquityMarketMaturityItem'
    OutputEquityMarketMaturityItem:
      type: object
      properties:
        DevelopedMarkets:
          type: number
          format: double
          description: Countries with mature economies and stock markets that benefit from a high degree of investor recourse, corporate governance and legal infrastructure.
        EmergingMarkets:
          type: number
          format: double
          description: Countries with fairly young economies and stock markets that offer higher growth potential and higher risk.
        NotAvailable:
          type: number
          format: double
          description: Countries that are neither developed nor emerging, or that lack a sufficiently liquid or transparent stock market.
    OutputEquityStyleItem:
      type: object
      properties:
        AverageMarketCap:
          type: number
          format: double
          description: Geometric mean of the market capitalizations of all stocks held, weighted by portfolio allocation.
    OutputAssetAllocationSecurity:
      type: object
      properties:
        SecurityId:
          type: string
          description: Unique identifier of a security.
        Analyzed:
          type: number
          format: double
          description: Percentage of security analyzed.
        NotAnalyzed:
          type: number
          format: double
          description: Percentage of security not analyzed.
        AssetClass:
          type: array
          items:
            $ref: '#/components/schemas/OutputAssetClassItem'
    OutputPerformanceRollingReturn:
      type: object
      properties:
        RollingPeriod:
          type: string
          enum:
          - Month24
          - Month120
          - '12'
          - '36'
          - '60'
          - '120'
        Portfolio:
          $ref: '#/components/schemas/OutputPerformanceRollingReturnsItem'
    OutputInterestRateRiskItemSecurity:
      type: object
      properties:
        SecurityId:
          type: string
          description: Unique identifier of a security.
        InterestRateRiskItem:
          $ref: '#/components/schemas/OutputSecurityInterestRateRiskItem'
    InputPortfolio:
      description: Object representing a portfolio to be analysed. Each holding must specify a security identifier and either `Weight` or `Value` to define its allocation. `TotalValue` is required when holdings use `Weight`.
      title: InputPortfolio
      required:
      - Currency
      - Holdings
      - Name
      type: object
      properties:
        Name:
          description: Portfolio name.
          type: string
        TotalValue:
          description: Total market value of the portfolio in the portfolio currency. Required when holdings use `Weight`.
          type: number
          format: double
          minimum: 1
          example: 20000
        Currency:
          description: Portfolio currency. 19 currencies are supported. Accepted values are ISO 4217 currency codes..
          type: string
          enum:
          - AUD
          - BRL
          - CAD
          - CHF
          - DKK
          - EUR
          - GBP
          - HKD
          - INR
          - JPY
          - MXN
          - MYR
          - NOK
          - NZD
          - SEK
          - SGD
          - TWD
          - USD
          - ZAR
          example: USD
        Holdings:
          type: array
          minItems: 1
          maxItems: 250
          items:
            $ref: '#/components/schemas/InputPortfolioHolding'
        Fees:
          $ref: '#/components/schemas/InputPortfolioFees'
        IrrFees:
          description: Annual fee used in the internal rate of return calculation.
          type: number
          format: double
          minimum: 1
          example: 1000
    OutputRiskSecurity.RiskStatisticsItem:
      type: object
      properties:
        Mean:
          type: number
          format: double
          description: Mean return over the trailing period.
        SharpeRatio:
          type: number
          format: double
          description: Risk-adjusted return per unit of risk. Year2 is not supported at the security level.
        StandardDeviation:
          type: number
          format: double
          description: Statistical measure of return dispersion around the mean, used as an indicator of volatility.
    OutputPerformanceStandardizedAndTaxAdjustedReturnsSecurity:
      type: object
      properties:
        Sequence:
          type: integer
          format: int32
          description: Sequence identifier.
        SecurityId:
          type: string
          description: Unique identifier of a security.
        StandardizedReturns:
          $ref: '#/components/schemas/OutputPerformanceStandardizedReturns'
        AfterTaxReturns:
          $ref: '#/components/schemas/OutputPerformanceAfterTaxReturns'
    OutputFixedIncomeSuperSectorDataBreakdown:
      type: object
      properties:
        SecurityId:
          type: string
          description: Unique identifier of a security.
        FixedIncomeSuperSectorDataItems:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemStringNumber'
    OutputDataItemEquityType:
      type: object
      properties:
        Id:
          type: string
          description: Equity type identifier.
          enum:
          - AggressiveGrowth
          - ClassicGrowth
          - Cyclical
          - Distressed
          - HardAsset
          - HighYield
          - NotAvailable
          - SlowGrowth
          - SpeculativeGrowth
        Value:
          type: number
          format: double
          description: Value of equity type.
    OutputFixedIncomeStyle:
      description: Fixed income style data.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        PortfolioAnalyzed:
          type: number
          format: double
          description: Percentage of portfolio analyzed.
        Portfolio:
          $ref: '#/components/schemas/OutputFixedIncomeStyleItem'
        Benchmark:
          $ref: '#/components/schemas/OutputFixedIncomeStyleItem'
        FixedIncomeStyleBreakdown:
          $ref: '#/components/schemas/OutputFixedIncomeStyleBreakdown'
    InputAssetClassGroupConfigs:
      description: Asset class group to query.
      type: object
      properties:
        AssetClassGroupConfig:
          type: array
          description: Asset class group identifier. Maximum of one value can be passed in a request.
          items:
            $ref: '#/components/schemas/InputAssetClassGroupConfig'
    OutputXRayOwnershipOwnership:
      description: Ownership zone data for equity holdings.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        Zones:
          type: array
          items:
            $ref: '#/components/schemas/OutputXRayOwnershipZone'
    OutputEquityTypeBreakdown:
      description: Portfolio stocks broken down into Morningstar equity type designations based on objective financial criteria.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        PortfolioAnalyzed:
          type: number
          format: double
          description: Percentage of portfolio analyzed.
        Portfolio:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemEquityType'
        Benchmark:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemEquityType'
        SecurityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/OutputEquityTypeBreakdownItemSecurity'
    OutputDataItemOutputAfterTaxReturnsTimePeriod:
      type: object
      properties:
        Id:
          type: string
          enum:
          - YearToDate
          - Month3
          - Year1
          - Year3
          - Year5
          - Year10
          - SinceInception
        Value:
          type: number
          format: double
          description: Value for the time period.
    InputRequestSettings:
      title: InputXRayRequestSettings
      required:
      - OutputCurrency
      description: Analysis settings including output currency, date range, performance frequency, and optional data sections.
      type: object
      properties:
        OutputCurrency:
          description: Currency used to calculate output values. 19 currencies are supported. Accepted values are ISO 4217 currency codes.
          type: string
          default: USD
          enum:
          - AUD
          - BRL
          - CAD
          - CHF
          - DKK
          - EUR
          - GBP
          - HKD
          - INR
          - JPY
          - MXN
          - MYR
          - NOK
          - NZD
          - SEK
          - SGD
          - TWD
          - USD
          - ZAR
          x-enumDescriptions:
            AUD: Australian Dollar
            BRL: Brazilian Real
            CAD: Canadian Dollar
            CHF: Swiss Franc
            DKK: Danish Krone
            EUR: Euro
            GBP: British Pound Sterling
            HKD: Hong Kong Dollar
            INR: Indian Rupee
            JPY: Japanese Yen
            MXN: Mexican Peso
            MYR: Malaysian Ringgit
            NOK: Norwegian Krone
            NZD: New Zealand Dollar
            SEK: Swedish Krona
            SGD: Singapore Dollar
            TWD: New Taiwan Dollar
            USD: United States Dollar
            ZAR: South African Rand
        AnalysisDateTimePeriod:
          description: End date period for the analysis. `CustomDate` requires `PortfolioPerformanceEndDate` to be set explicitly.
          type: string
          enum:
          - MonthEnd
          - QuarterEnd
          - YearEnd
          - CustomDate
          default: MonthEnd
        AssetClassGroupConfigs:
          $ref: '#/components/schemas/InputAssetClassGroupConfigs'
        DisableRescale:
          description: When `true`, portfolio weights are not rescaled if any holdings are invalid or unentitled.
          type: boolean
          default: false
        EnablePerformanceCommonEndDate:
          description: When `true`, the most recent common end date across all portfolios is used as the analysis end date.
          type: boolean
          default: false
        IncludeGrossNetReturns:
          description: When `true`, both gross and net return values are included in trailing returns and calendar year return data.
          type: boolean
          default: false
        IncludePortfolioInCorrelationMatrix:
          description: When `true`, the portfolio is included as an entry in the correlation matrix.
          type: boolean
          default: false
        InitialValue:
          description: Initial value of the portfolio in the output currency.
          type: number
          format: double
          minimum: 1
          default: 10000
        MaxCorrelationMatrixHoldingNumber:
          description: Maximum number of holdings to include in the correlation matrix. Only applies when `ReturnDataSections` includes `CorrelationMatrix`.
          type: integer
          format: int32
          default: 50
          minimum: 2
          maximum: 50
        PerformanceFrequency:
          description: Frequency of performance returns and risk calculations.
          enum:
          - Monthly
          - Quarterly
          type: string
          default: Monthly
        PortfolioPerformanceStartDate:
          description: Start date of the analysis. `CustomDate` requires `PortfolioPerformanceCustomStartDate` to be set explicitly.
          type: string
          enum:
          - EarliestCommon
          - EarliestAvailable
          - EarliestCommonExtended
          - EarliestCommonExtended10Year
          - Year10
          - CustomDate
          default: EarliestCommon
        PortfolioPerformanceEndDate:
          type: string
          description: End date of the analysis. Required when `AnalysisDateTimePeriod` is set to `CustomDate`.
          format: date
          example: '2022-10-31'
        PortfolioPerformanceCustomStartDate:
          type: string
          description: 'Custom start date of the analysis. Required when `PortfolioPerformanceStartDate` is set to `CustomDate`. Note: this field name contains a trailing space.'
          format: date
          example: '2022-10-31'
        ReturnDataSections:
          description: Additional data sections to include in the response. See `RollingReturnFrequencies` and `MaxCorrelationMatrixHoldingNumber` for related configuration.
          type: array
          items:
            type: string
            enum:
            - CorrelationMatrix
            - RollingReturns
            example: RollingReturns
        RollingReturnFrequencies:
          description: Rolling return periods to calculate. Required when `ReturnDataSections` includes `RollingReturns`.
          type: array
          items:
            type: string
            enum:
            - Month3
            - Month6
            - Year1
            - Year3
            - Year5
            - Year10
            example: Month3
        RollingReturnStep:
          description: Step interval (in months) between rolling return calculations. Only applies when `ReturnDataSections` includes `RollingReturns`.
          type: integer
          format: int32
          default: 1
          minimum: 1
        SynchronizePortfolioStartDate:
          description: When `true`, the latest common start date across all portfolios is used as the analysis start date for all portfolios.
          type: boolean
          default: false
    OutputXRayStatisticsStatisticsItem:
      description: Statistics data.
      type: object
      properties:
        PortfolioSummary:
          $ref: '#/components/schemas/OutputXRayStatisticsPortfolioStatisticsSummary'
        FundStatistics:
          $ref: '#/components/schemas/OutputXRayStatisticsFundStatistics'
    OutputXRayHoldingsHoldingsItem:
      description: Holdings data.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        RegionAnalysis:
          $ref: '#/components/schemas/OutputXRayHoldingsRegionAnalysis'
        TopNetUnderlyingHoldings:
          $ref: '#/components/schemas/OutputXRayHoldingsTopNetUnderlyingHoldings'
        PortfolioHoldings:
          $ref: '#/components/schemas/OutputXRayHoldingsPortfolioHoldings'
        StockIntersection:
          $ref: '#/components/schemas/OutputXRayHoldingsStockIntersection'
    OutputRiskCorrelationMatrix:
      description: Correlation matrix data showing pairwise return correlations between holdings and/or the portfolio.
      type: object
      properties:
        TrailingTimePeriod:
          type: string
          description: Trailing time period over which correlations are calculated.
          enum:
          - Year3
          - Year5
          - Year10
        DataFrequency:
          type: string
          description: Frequency of data used in the calculation.
          enum:
          - Monthly
        StartDate:
          type: string
          format: date-time
          description: Start date of the correlation calculation period.
        EndDate:
          type: string
          format: date-time
          description: End date of the correlation calculation period.
        Correlations:
          type: array
          items:
            $ref: '#/components/schemas/OutputRiskCorrelationItemKey'
    OutputXRayHoldingsRegionAnalysis:
      description: Count of portfolio holdings allocated by region.
      type: object
      properties:
        US:
          type: integer
          format: int32
          description: Number of holdings allocated to the US region.
        NotClassified:
          type: integer
          format: int32
          description: Number of holdings not classified to a region.
        Foreign:
          type: integer
          format: int32
          description: Number of holdings allocated to foreign regions.
        Cash:
          type: integer
          format: int32
          description: Number of cash holdings.
    OutputPerformanceInvestmentActivity:
      description: Investment activity data.
      type: object
      properties:
        DataFrequency:
          type: string
          description: Frequency of investment activity data.
          enum:
          - Monthly
        Portfolio:
          type: array
          items:
            $ref: '#/components/schemas/OutputPerformanceInvestmentActivityItem'
        Benchmark:
          type: array
          items:
            $ref: '#/components/schemas/OutputPerformanceBenchmarkInvestmentActivityItem'
    OutputXRayHoldingsPortfolioHoldings:
      description: Portfolio holdings data.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        Security:
          type: array
          items:
            $ref: '#/components/schemas/OutputXRayHoldingsPortfolioHolding'
    OutputAssetAllocation:
      description: Long, short, and net asset allocation positions. Asset class grouping depends on request settings.
      type: object
      properties:
        Id:
          type: string
          description: Asset class group identifier.
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        PortfolioAnalyzed:
          type: number
          format: double
          description: Percentage of portfolio analyzed.
        Portfolio:
          type: array
          items:
            $ref: '#/components/schemas/OutputAssetClassItem'
        Benchmark:
          type: array
          items:
            $ref: '#/components/schemas/OutputAssetClassItem'
        SecurityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/OutputAssetAllocationSecurity'
    OutputRiskCaptureRatioItem:
      type: object
      properties:
        Downside:
          $ref: '#/components/schemas/OutputRiskDownsideItems'
        Upside:
          $ref: '#/components/schemas/OutputRiskUpsideItems'
    OutputEquitySectorExposureItem:
      type: object
      properties:
        Id:
          type: string
          description: Parent/rollup sector identifier.
        Value:
          type: number
          format: double
          description: Sector exposure value.
        ExposureItem:
          type: array
          description: Child sector items. Values are client-specific and may follow GICS, Morningstar, or institution-defined classifications.
          items:
            $ref: '#/components/schemas/OutputDataItemStringNumber'
    OutputPriceRatios:
      description: Price ratio data for the portfolio and benchmark.
      type: object
      properties:
        AsOfDate:
          type: string
          format: date-time
          description: End date of analysis.
        Portfolio:
          $ref: '#/components/schemas/OutputPriceRatiosItem'
        Benchmark:
          $ref: '#/components/schemas/OutputPriceRatiosItem'
        SecurityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/OutputPriceRatiosItemSecurity'
    OutputPerformanceBenchmarkTrailingReturnsItem:
      type: object
      properties:
        TimePeriod:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemBenchmarkTrailingTimePeriod'
    OutputRiskCorrelatedItemKey:
      type: object
      properties:
        CorrelatedItemKeyId:
          type: integer
          format: int32
        Type:
          type: string
          description: Indicates whether the correlated item is a portfolio or an individual security.
          enum:
          - Portfolio
          - Security
        Value:
          type: number
          format: double
          description: Correlation coefficient between this item and the referenced item.
    OutputPerformanceDate:
      description: Key performance date reference points for the portfolio.
      type: object
      properties:
        EarliestCommonDate:
          description: The earliest date for which all holdings in the portfolio have return data.
          type: string
          format: date-time
        EarliestAvailableDate:
          description: The earliest date for which any holding in the portfolio has return data.
          type: string
          format: date-time
        EarliestInceptionDate:
          description: The inception date of the most recently launched holding in the portfolio.
          type: string
          format: date-time
        EarliestCommonExtendedDate:
          description: The earliest common date calculated using extended return history where available.
          type: string
          format: date-time
    OutputCreditQualityItem:
      type: object
      properties:
        AAA:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        AA:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        A:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        BBB:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        BB:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        B:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        BelowB:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
        NotRated:
          type: number
          format: double
          description: Percentage of fixed income holdings assigned to this credit quality rating band.
    OutputPerformanceBenchmarkCalendarYearReturn:
      type: object
      properties:
        CalendarYear:
          type: array
          description: Calendar year return data. Index 1–10 represents the 10 most recent calendar years.
          items:
            $ref: '#/components/schemas/OutputDataItemInt32'
    OutputDataItemCalendarYearReturnTimePeriod:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          description: Calendar year return identifier (1–10, representing the 10 most recent years).
        Value:
          type: number
          format: double
          description: Calendar year return value.
        GrossValue:
          type: number
          format: double
          description: Gross calendar year return value.
    OutputRiskRiskStatisticsSecurityItem:
      type: object
      properties:
        SecurityId:
          type: string
          description: Unique identifier of a security.
        Weight:
          type: number
          format: double
          description: Percentage of portfolio assets allocated to this holding.
        RiskStatisticsItem:
          $ref: '#/components/schemas/OutputRiskSecurity.RiskStatisticsItem'
    OutputXRayStatisticsSecurityFundStatisticsItem:
      type: object
      properties:
        AverageNetExpenseRatio:
          type: number
          format: double
          description: Percentage of fund assets, net of reimbursements, used to pay operating expenses and management fees. Does not include brokerage or sales charges.
        AverageGrossExpenseRatio:
          type: number
          format: double
          description: Percentage of fund assets used to pay operating expenses and management fees before any reimbursements. Does not include brokerage or sales charges.
        PotentialCapGainsExposure:
          type: number
          format: double
          description: Estimated percentage of fund assets representing unrealized gains. An indicator of possible future capital gain distributions.
    OutputPerformanceTrailingReturnsItem:
      type: object
      properties:
        TimePeriod:
          type: array
          items:
            $ref: '#/components/schemas/OutputDataItemTrailingTimePeriod'
    OutputXRayHoldingsStockIntersectionItemSource:
      type: object
      properties:
        SecurityId:
          type: string
          description: Unique identifier of a security.
        CUSIP:
          type: string
          description: Nine-character CUSIP identifier consisting of a six-character issuer number, two-character issue number, and one check digit.
        FundPortfolioDate:
          type: string
          format: date-time
          description: The date the portfolio was reported.
        PercentOfInvestments:
          type: number
          format: double
          description: Percentage of total portfolio investments.
        MarketValue:
          type: number
          format: double
          description: Current market value of the holding.
    OutputEquityRegionExposureItem:
      type: object
      properties:
        Id:
          type: string
          description: Parent/rollup region identifier.
        Value:
          type: number
          format: double
          description: Value for world region.
        ExposureItem:
