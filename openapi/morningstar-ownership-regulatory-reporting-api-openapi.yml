components:
  schemas:
    CodeMappingBoolean:
      type: object
      properties:
        value:
          type: string
          nullable: true
        code:
          type: boolean
          nullable: true
      additionalProperties: false
      title: CodeMappingBoolean
    OutputMetadataMessages:
      type: object
      properties:
        type:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        investments:
          type: array
          items:
            $ref: '#/components/schemas/OutputInvalidInvestments'
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
      title: OutputMetadataMessages
    OutputUkStakeholderOwnership:
      type: object
      properties:
        fileDate:
          type: string
          description: Date on which file is published
          nullable: true
        ukStakeholderOwnershipAsOfDate:
          type: string
          description: Date upon which the shares are held by shareholder.
          nullable: true
        ukStakeholderOwnershipOwnerId:
          type: string
          description: Unique Morningstar id's assigned to particular shareholders.
          nullable: true
        ukStakeholderOwnershipOwnerName:
          type: string
          description: The entity that owns the security.
          nullable: true
        ukStakeholderOwnershipNumberOfShares:
          type: string
          description: Number of shares of the security owned by the shareholder.
          nullable: true
        ukStakeholderOwnershipSharesPercentage:
          type: string
          description: Percentage of share holding  at company level.
          nullable: true
        ukStakeholderOwnershipHoldingDescription:
          type: string
          description: If an insider's interest is duplicated with other insiders or major shareholders, such as an insider representing a major shareholder on the board of directors, this is detailed in holding description.
          nullable: true
        ukStakeholderOwnershipHoldingType:
          type: string
          description: Type of Holding - Beneficial or Non-beneficial.
          nullable: true
        asOfDate:
          type: string
          description: Date upon which the shares are held by shareholder; or the transaction happens
          nullable: true
        cessation:
          $ref: '#/components/schemas/CodeMappingBoolean'
        holdingDescription:
          type: string
          description: If an insider's interest is duplicated with other insiders or major shareholders; such as an insider representing a major shareholder on the board of directors; this is detailed in holding description. The content of this field is entered as 'dup 1'; 'dup A'; 'dup A and B' etc; where dup is abbreviated from duplicate. Related owners can be identified by the content of the field; for instance; where two owners of shares in the same company have reference to dup A in holding description there is a relationship between them that the local reporting regulations require to be disclosed to the market. This item relates only to insiders of LSE-listed companies. See data ID 46003 for the corresponding item in the UK major shareholder transactions file
          nullable: true
        holdingType:
          type: string
          description: Type of Holding- Beneficial or Non-beneficial
          nullable: true
        isCurrent:
          $ref: '#/components/schemas/CodeMappingBoolean'
        isExholding:
          $ref: '#/components/schemas/CodeMappingBoolean'
        newReport:
          type: boolean
          description: Flag denotes if it's the first time the owner became major shareholder
          nullable: true
        notifiedDate:
          type: string
          description: Date notified by the Company
          nullable: true
        numberOfShares:
          type: integer
          description: Number of shares of the security owned by the shareholder; or the Number of shares after transaction
          format: int64
          nullable: true
        ownerId:
          type: string
          description: Unique Morningstar id's assigned to particular shareholders
          nullable: true
        ownerName:
          type: string
          description: The entity that owns the security. Examples of owners are 13F filing institutions; 13D and 13G beneficial owners; and advisor companies
          nullable: true
        shareHolderId:
          type: integer
          description: A.k.a Id on interface. Series id for each shareholder records within filing. Auto-assign in ascending order per filing; start with 1.
          format: int64
          nullable: true
        sharesOwnedPostTransactionPercentage:
          type: number
          description: Owner's balance percentage shares holding (post-trading) for specific holding date
          format: double
          nullable: true
        sharesPercentage:
          type: number
          description: Percentage of share holding  at company level
          format: double
          nullable: true
        sharesPercentageCompanyLevel:
          type: number
          description: Shareholding percentage in respect to Company TSO
          format: double
          nullable: true
        sharesTransactionPercentage:
          type: number
          description: Percentage of number of shares in transaction
          format: double
          nullable: true
        transactionCurrency:
          type: string
          description: Currrency in which transaction took place
          nullable: true
        transactionPrice:
          type: number
          description: Price per share for the transaction
          format: double
          nullable: true
        transactionShares:
          type: integer
          description: Number of shares the owner buys or sells in the transaction
          format: int64
          nullable: true
        transactionType:
          type: string
          description: Type of transaction:P - PurchaseS - SaleT - Transfer InU - Transfer OutD - In Lieu of DividendE - Exercise of OptionsO - Sale after ExerciseC - Received on ConversionR - Take-up of RightsN - Not Applicable
          nullable: true
        transactionValue:
          type: number
          description: Total value for the transaction (price per share*no. of shares)
          format: double
          nullable: true
      additionalProperties: false
      title: OutputUkStakeholderOwnership
    OutputOwnershipDataSecAndSedar:
      type: object
      properties:
        asOfDate:
          type: string
          description: ''
          nullable: true
        accessionNumberForm13f:
          type: string
          description: ''
          nullable: true
        filerCik:
          type: string
          description: ''
          nullable: true
        filingDateForm13f:
          type: string
          description: ''
          nullable: true
        numberOfShares:
