components:
  schemas:
    OutputAggregationLeverage:
      type: object
      properties:
        periodEndDate:
          type: string
          description: The month-end date of the industry aggregated value
          nullable: true
        debtToAssetsRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        debtToAssetsRatioValue:
          type: number
          description: 'The aggregated value of Debt to Assets Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Debt to Assets Ratio: This ratio represents the value of a company''s total debt relative to its total assets. This can be used as a leverage ratio to measure a company''s financial risk. This is calculated using Total Debt divided by Total Asset.'
          format: double
          nullable: true
        debtToEquityRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        debtToEquityRatioValue:
          type: number
          description: 'The aggregated value of Debt to Equity Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Debt to Equity Ratio: This ratio represents the value of a company''s long term debt relative to its total equity. This can be used as a leverage ratio to measure a company''s financial risk. This is calculated using Long-term debt and Capital Lease Obiligation; divided by Total Equity.'
          format: double
          nullable: true
        equityMultiplierRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        equityMultiplierRatioValue:
          type: number
          description: 'The aggregated value of Equity Multiplier Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Equity Multiplier Ratio: This ratio represents the value of a company''s total assets relative to its total equity. This can be used to measure a company''s financial leverage and is often referred to as the Financial Leverage Ratio. This is calculated using Total Assets divided by Total Equity.'
          format: double
          nullable: true
        numberOfCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector
          format: int32
          nullable: true
        totalDebtToEquityRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        totalDebtToEquityRatioValue:
          type: number
          description: 'The aggregated value of Total Debt to Equity Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Total Debt to Equity Ratio: This ratio represents the value of a company''s total debt relative to its total equity. This can be used to measure the company''s financial leverage. This is calculated using Total Debt divided by Total Equity.'
          format: double
          nullable: true
        totalDebtToInvestedCapitalRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        totalDebtToInvestedCapitalRatioValue:
          type: number
          description: 'The aggregated value of Total Debt to Invested Capital Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Total Debt to Invested Capital Ratio: This ratio represents the value of a company''s total debt relative to its invested capital. This can be used to measure the company''s financial leverage. This is calculated using Total Debt divided by Invested Capital.'
          format: double
          nullable: true
      additionalProperties: false
      title: OutputAggregationLeverage
    OutputAggregationPriceMultiples:
      type: object
      properties:
        asOfDate:
          type: string
          description: The calendar date of the industry aggregated value
          nullable: true
        capeRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int32
          nullable: true
        capeRatioValue:
          type: number
          description: 'The aggregated value of CAPE Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. CAPE Ratio: The Cyclically-Adjusted-Price-to-Earnings Ratio measures the value of the company using real earnings per share (EPS) over a 10-year period to smooth out fluctuations in corporate profits that occur over different periods of a business cycle. This is calculated using Stock Price divided by the average of the company''s earnings for the last ten years; adjusted for inflation.'
          format: double
          nullable: true
        normalizedPriceEarningsToGrowthRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int32
          nullable: true
        normalizedPriceEarningsToGrowthRatioValue:
          type: number
          description: 'The aggregated value of Normalized PEG Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Normalized PEG Ratio: This calculation represents the Normalized Price to Earnings ratio divided by the normalized earnings growth rate. This can be used to determine the fair value of the stock price; while accounting for the company''s earnings growth. This can be calculated using Normalized Price to Earnings / (Normalized Diluted EPS 5Y Growth*100).'
          format: double
          nullable: true
        normalizedPriceToEarningsRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int32
          nullable: true
        normalizedPriceToEarningsRatioValue:
          type: number
          description: 'The aggregated value of Normalized Price to Earnings Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Normalized Price to Earnings Ratio: This ratio represents the value of a company''s stock price relative to its normalized earnings per share. This can be used to determine the fair value the stock price. This is calculated using Stock Price divided by Normalized EPS (TTM).'
          format: double
          nullable: true
        normalizedPriceToEbitdaRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
