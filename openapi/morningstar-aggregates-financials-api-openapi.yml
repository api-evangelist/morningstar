          description: 'The aggregated value of EBITDA Interest Coverage; is derived using all eligible companies who are constituents in the specified Morningstar Index. EBITDA Interest Coverage: This ratio represents the value of a company''s EBITDA relative to its interest expense. This can be used to measure a company''s ability to use EBITDA to pay off its interest expense. This is calculated using EBITDA divided by Interest Expense.'
          format: double
          nullable: true
        freeCashFlowToDebtRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        freeCashFlowToDebtRatioValue:
          type: number
          description: 'The aggregated value of FCF to Debt Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. FCF to Debt Ratio: This ratio represents the value of a company''s free cash flow relative to its total debt. This can be used to measure a company''s ability to use its free cash to pay off its debt. This is calculated using the Free Cash Flow (TTM) divided by Average Total Debt.'
          format: double
          nullable: true
        interestCoverageNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        interestCoverageValue:
          type: number
          description: 'The aggregated value of Interest Coverage; is derived using all eligible companies who are constituents in the specified Morningstar Index. Interest Coverage: This ratio represents the value of a company''s earnings before interest and taxes (EBIT) relative to its interest expenses. This can be used to measure the number of times a company''s EBIT covers its interest expenses. This is calculated using EBIT divided by Interest Expense.'
          format: double
          nullable: true
        inventoryTurnoverRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        inventoryTurnoverRatioValue:
          type: number
          description: 'The aggregated value of Inventory Turnover Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Inventory Turnover Ratio: This ratio represents the value of a company''s cost of revenue relative to its average inventory. This can be used as an efficiency ratio measuring how many times inventory is sold and replaced during the TTM period. This is calculated using Cost of Revenue (TTM) divided by Average Inventories.'
          format: double
          nullable: true
        numberOfCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector
          format: int32
          nullable: true
        payableTurnoverRatioNumberOfEligibleCompanies:
          type: number
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: double
          nullable: true
        payableTurnoverRatioValue:
          type: number
          description: 'The aggregated value of Payable Turnover Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Payable Turnover Ratio: This ratio represents the value of a company''s cost of revenue relative to its trade payables. This can be used to measure a company''s short term liquidity; by measuring how fast the company is able to pay its creditors. This is calculated using Cost of Revenue (TTM) divided by Average Trade and Other Payables.'
          format: double
          nullable: true
        quickRatioNumberOfEligibleCompanies:
          type: number
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: double
          nullable: true
        quickRatioValue:
          type: number
          description: 'The aggregated value of Quick Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Quick Ratio: This ratio represents the value of a company''s most liquid assets relative to its current liabilities. This can be used to measure a company''s liquidity. This is calculated using (Cash; Cash Equivalents; and Short Term Investments + Trade and Other Receivables; Current) / Total Current Liabilities.'
          format: double
          nullable: true
        receivableTurnoverRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        receivableTurnoverRatioValue:
          type: number
          description: 'The aggregated value of Receivable Turnover Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Receivable Turnover Ratio: This ratio represents the value of a company''s total revenue relative to its trade account receivables. This can be used to measure how many times; on average; a company is able to collect its receivables during a year. This is calculated using Total Revenue (TTM) divided by Average Trade Accounts Receivable.'
          format: double
          nullable: true
