          format: double
          nullable: true
        cashConversionCycleNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        cashConversionCycleValue:
          type: number
          description: 'The aggregated value of Cash Conversion Cycle; is derived using all eligible companies who are constituents in the specified Morningstar Index. Cash Conversion Cycle: This ratio represents the time it takes a company to convert its resources into cash. This ratio measures the amount of time that each dollar of the company is spent on the production and sale of goods before it is converted back into cash. This is calculated using Days in Sales + Days in Inventory - Days in Payment.'
          format: double
          nullable: true
        equityTurnoverRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        equityTurnoverRatioValue:
          type: number
          description: 'The aggregated value of Equity Turnover Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Equity Turnover Ratio: This ratio represents the value of a company''s total revenue relative to its average equity. This can be used to measure a company''s ability to use the equity efficiently to generate revenue. This is calculated using Total Revenue (TTM) divided by Average Equity.'
          format: double
          nullable: true
        expenseRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        expenseRatioValue:
          type: number
          description: 'The aggregated value of Expense Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Expense Ratio: This ratio represents the total expenses an insurer faces as a result of underwriting a policy as a percentage of premiums earned. This can be used to measure the profitability of an insurance company. This is calculated using (Deferred Policy Acquisition Amortization Expense + Fees and Commission Expense + Other Underwriting Expenses + Selling; General and Administrative) / Net Premiums Earned'
          format: double
          nullable: true
        fixedAssetTurnoverRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        fixedAssetTurnoverRatioValue:
          type: number
          description: 'The aggregated value of Fixed Asset Turnover Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Fixed Asset Turnover Ratio: This ratio represents the value of a company''s total revenue relative to its fixed assets. This can be used to measure a company''s ability to use its fixed asset efficiently to generate revenue. This is calculated using Total Revenue (TTM) / (Average Net Property; Plant and Equipment/Net Mineral Property Interests and Exploration Assets).'
          format: double
          nullable: true
        lossRatioNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        lossRatioValue:
          type: number
          description: 'The aggregated value of Loss Ratio; is derived using all eligible companies who are constituents in the specified Morningstar Index. Loss Ratio: This ratio represents the losses an insurer faces as a result of paying out insurance claims as a percentage of premiums earned. This can be used to measure the profitability of an insurance company. This is calculated using Benefits; Claims and Loss Adjustment Expense; Net (TTM) divided by Net Premiums Earned.'
          format: double
          nullable: true
        numberOfCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector
          format: int32
          nullable: true
        salesPerFullTimeEmployeeNumberOfEligibleCompanies:
          type: integer
          description: The number of companies assigned to each level of the industry/industry group/sector classification within a particular country that has a qualifying value included in the calculation of the aggregated value; or if 'GBL'; the number of companies across the globe assigned to that industry/industry group/sector with a qualifying value included in the calculation of the aggregated value.
          format: int64
          nullable: true
        salesPerFullTimeEmployeeValue:
          type: number
          description: 'The aggregated value of Sales Per Full Time Employee; is derived using all eligible companies who are constituents in the specified Morningstar Index. Sales Per Full Time Employee: This calculation represents the amount of revenue generated by each full time employee. This can be used to measure a company''s productivity. This is calculated using Total Revenue (TTM) divided by Number of Full Time Employees.'
          format: double
          nullable: true
