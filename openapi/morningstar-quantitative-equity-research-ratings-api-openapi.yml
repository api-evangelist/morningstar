components:
  schemas:
    CodeMappingBoolean:
      type: object
      properties:
        value:
          type: string
          nullable: true
        code:
          type: boolean
          nullable: true
      additionalProperties: false
      title: CodeMappingBoolean
    OutputMetadataMessages:
      type: object
      properties:
        type:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        investments:
          type: array
          items:
            $ref: '#/components/schemas/OutputInvalidInvestments'
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
      title: OutputMetadataMessages
    CodeMappingString:
      type: object
      properties:
        value:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
      additionalProperties: false
      title: CodeMappingString
    OutputErrorDetails:
      type: object
      properties:
        statusCode:
          type: integer
          description: Status Code
          format: int32
        errorCode:
          type: string
          description: Custom error code
          nullable: true
        message:
          type: string
          description: Message
          nullable: true
        requestId:
          type: string
          description: RequestId
          nullable: true
      additionalProperties: false
      description: Error details
      title: OutputErrorDetails
    OutputInvalidInvestments:
      type: object
      properties:
        id:
          type: string
          nullable: true
        idType:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        datapointId:
          type: array
          items:
            type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        performanceId:
          type: string
          description: Performance ID (if not passed in request).
          nullable: true
        companyId:
          type: string
          description: Company ID (if not passed in request).
          nullable: true
        baseCurrency:
          type: string
          description: Input base currency used to look up Investment identifier
          nullable: true
        domicile:
          type: string
          description: Input domicile used to look up Investment identifier.
          nullable: true
        exchangeCountry:
          type: string
          description: Input exchange country used to look up Investment identifier.
          nullable: true
        exchangeId:
          type: string
          description: Input exchange id used to look up Investment identifier.
          nullable: true
      additionalProperties: false
      title: OutputInvalidInvestments
    OutputIdentifiers:
      type: object
      properties:
        performanceId:
          type: string
          nullable: true
        securityId:
          type: string
          nullable: true
        cusip:
          type: string
          nullable: true
        isin:
          type: string
          nullable: true
        sedol:
          type: string
          nullable: true
        tradingSymbol:
          type: string
          nullable: true
        fundCode:
          type: string
          nullable: true
        msid:
          type: string
          nullable: true
        ticker:
          type: string
          nullable: true
      additionalProperties: false
      title: OutputIdentifiers
    OutputMetadata:
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
          readOnly: true
        portfolioDate:
          type: string
          nullable: true
        portfolioCurrency:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutputMetadataMessages'
          nullable: true
      additionalProperties: false
      title: OutputMetadata
    OutputQuantitativeRatings:
      type: object
      properties:
        quantitativeStarRatingDate:
          type: string
          description: ''
          nullable: true
        isMomentumFilterFlag:
          $ref: '#/components/schemas/CodeMappingBoolean'
        methodologyVersionId:
          type: string
          description: Methodology version identifier
          nullable: true
        priceDate:
          type: string
          description: Date of the price used to calculate the p/fv; may be before the rating date
          nullable: true
        quantitativePriceToFairValue:
          type: number
          description: Price to fair value (p/fv) multiple
          format: double
          nullable: true
        quantitativeStarRating:
          $ref: '#/components/schemas/CodeMappingInt'
        quantitativeStarRatingCalculationTimestamp:
          type: string
          description: Date & time of the star rating calculation
          nullable: true
        quantitativeStarRatingPublishDate:
          type: string
          description: Date of the star rating publication
          nullable: true
        quantitativeValuationLabel:
          $ref: '#/components/schemas/CodeMappingString'
        quantitativeStarRatingDateMax:
          $ref: '#/components/schemas/CodeMappingString'
        quantitativeStarRatingDateMin:
          $ref: '#/components/schemas/CodeMappingString'
      additionalProperties: false
      title: OutputQuantitativeRatings
    OutputQuantitativeFairValues:
      type: object
      properties:
        quantitativeFairValueDate:
          type: string
          description: ''
          nullable: true
        asOfClosePriceDate:
          type: string
          description: Date of price used to calculate quantitative fair value
          nullable: true
        quantitativeFairValueDateMax:
          type: string
          description: Date on which fair value is calculated
          nullable: true
        quantitativeFairValueDateMin:
          type: string
          description: ''
          nullable: true
        closePrice:
          type: number
          description: Close price used to calculate quantitative fair value
          format: double
          nullable: true
        liquidityLabel:
          $ref: '#/components/schemas/CodeMappingString'
        methodologyVersionId:
          type: string
          description: Methodology version identifier
          nullable: true
        quantitativeFairValue:
          type: number
          description: Fair value
          format: double
          nullable: true
        quantitativeFairValueCalculationTimestamp:
          type: string
          description: Date & time of the fair value calculation
          nullable: true
        quantitativeFairValuePublishDate:
          type: string
          description: Date of the fair value publication
          nullable: true
        quantitativeFairValueUncertainty:
          type: number
          description: Fair value uncertainty
          format: double
          nullable: true
        quantitativeFairValueUncertaintyLabel:
          $ref: '#/components/schemas/CodeMappingString'
        quantitativeFinancialHealth:
          type: number
          description: Quantitative financial health score
          format: double
          nullable: true
        quantitativeFinancialHealthLabel:
          $ref: '#/components/schemas/CodeMappingString'
        quantitativeFiveStarPrice:
          type: number
          description: Price above which the stock would have a five star rating applied
          format: double
          nullable: true
        quantitativeMoat:
          type: number
          description: Quantitative moat
          format: double
          nullable: true
        quantitativeMoatLabel:
          $ref: '#/components/schemas/CodeMappingString'
        quantitativeOneStarPrice:
          type: number
          description: Price below which the stock would have a one star rating applied
          format: double
          nullable: true
      additionalProperties: false
      title: OutputQuantitativeFairValues
    CodeMappingInt:
      type: object
      properties:
        value:
          type: string
          nullable: true
        code:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
      title: CodeMappingInt
  responses:
    ResponseQuantitativeFairValue:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              quantitativeFairValues:
                $ref: '#/components/schemas/OutputQuantitativeFairValues'
              identifiers:
                $ref: '#/components/schemas/OutputIdentifiers'
              metadata:
                $ref: '#/components/schemas/OutputMetadata'
    ResponseQuantitativeRatings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              quantitativeRatings:
                $ref: '#/components/schemas/OutputQuantitativeRatings'
              identifiers:
                $ref: '#/components/schemas/OutputIdentifiers'
              metadata:
                $ref: '#/components/schemas/OutputMetadata'
    ResponseBadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutputErrorDetails'
    ResponseQuantitativeEquityResearchRatings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              quantitativeFairValues:
                $ref: '#/components/schemas/OutputQuantitativeFairValues'
              quantitativeRatings:
                $ref: '#/components/schemas/OutputQuantitativeRatings'
              identifiers:
                $ref: '#/components/schemas/OutputIdentifiers'
              metadata:
                $ref: '#/components/schemas/OutputMetadata'
    ResponseInternalServerError:
      description: Internal Server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OutputErrorDetails'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
