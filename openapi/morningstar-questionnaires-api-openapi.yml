components:
  schemas:
    Question:
      type: object
      properties:
        id:
          type: string
          description: Question unique identifier
          example: FM10-1
        titleText:
          type: string
          description: Question title text
          example: Self-Rating
        multipleSelect:
          type: boolean
          description: Multiple selections for the question, if this is true the question allows multiple answers
          example: false
        displayOrder:
          type: integer
          description: Question display order
          example: 1
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/Paragraph'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
    Paragraph:
      title: Paragraph
      type: object
      properties:
        text:
          type: string
          description: Paragraph text
          example: Compared to others, how do you rate your willingness to take financial risks?
        htmlMarkup:
          type: boolean
          description: True if the text field is an HTML markup, otherwise text field is plain text
          example: false
        image:
          type: boolean
          description: True if the paragraph is an image, otherwise is text
          example: true
        imageHref:
          type: string
          description: Image URL
          example: https://www.morningstart.com/finametrica/images/risk.png
    Option:
      title: Option
      type: object
      properties:
        id:
          type: string
          description: Option unique identifier
          example: FM10-1-1
        text:
          type: string
          description: Option text
          example: Extremely low risk taker.
        displayOrder:
          type: integer
          description: Question display order
          example: 1
        htmlMarkup:
          type: boolean
          description: True if the text field is an HTML markup, otherwise text field is plain text
          example: false
        image:
          type: boolean
          description: True if the option is an image, otherwise is text
          example: false
        imageHref:
          type: string
          description: Image URL
          example: https://www.morningstart.com/finametrica/images/risk.png
    ErrorResponse400:
      title: ErrorResponse
      type: object
      properties:
        message:
          type: string
          description: Error Message
          example: Server cannot or will not process the request due to something that is perceived to be a client error
        status:
          type: string
          description: Error Status
          example: BAD_REQUEST
        timestamp:
          type: string
          description: Error Timestamp
          example: 2020-08-05T13:40:25+0000
    Questionnaire:
      title: Questionnaire
      type: object
      properties:
        title:
          type: string
          description: Questionnaire title
          example: FinaMetrica 10
        id:
          type: string
          description: Questionnaire unique identifier
          example: FM10S30
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    ErrorResponse500:
      title: ErrorResponse
      type: object
      properties:
        message:
          type: string
          description: Error Message
          example: Internal Server Error
        status:
          type: string
          description: Error Status
          example: INTERNAL_SERVER_ERROR
        timestamp:
          type: string
          description: Error Timestamp
          example: 2020-08-05T13:40:25+0000
    ErrorResponse502:
      title: ErrorResponse
      type: object
      properties:
        message:
          type: string
          description: Error Message
          example: Received an invalid response from the upstream server
        status:
          type: string
          description: Error Status
          example: BAD_GATEWAY
        timestamp:
          type: string
          description: Error Timestamp
          example: 2020-08-05T13:40:25+0000
    ErrorResponse404:
      title: ErrorResponse
      type: object
      properties:
        message:
          type: string
          description: Error Message
          example: Server can't find the requested resource
        status:
          type: string
          description: Error Status
          example: NOT_FOUND
        timestamp:
          type: string
          description: Error Timestamp
          example: 2020-08-05T13:40:25+0000
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
