openapi: 3.2.0
info:
  title: Morningstar Securities API
  version: 1.0.0
  description: 'Operations tagged securities across 2 of this provider''s published API definitions: morningstar-securities-global-openapi.json, morningstar-securities-us-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://www.emea-api.morningstar.com/ecint/v1
  description: PROD
- url: https://www.emea-uat-api.morningstar.com/ecint/v1
  description: UAT
- url: https://www.apac-api.morningstar.com/ecint/v1
  description: PROD
- url: https://www.apac-uat-api.morningstar.com/ecint/v1
  description: UAT
- url: https://www.us-api.morningstar.com/ec/v1/
  description: PROD
- url: https://www.us-uat-api.morningstar.com/ec/v1/
  description: UAT
security:
- bearerAuth: []
tags:
- name: Securities
paths:
  /securities/{securityId}:
    get:
      summary: Get information for the security specified
      description: Information returned depends on the view specifed in the request.
      tags:
      - Securities
      operationId: LocalwithJWT
      deprecated: false
      parameters:
      - name: securityId
        description: Security ID
        in: path
        required: true
        schema:
          type: string
      - name: viewId
        description: View ID
        in: query
        required: true
        schema:
          type: string
      - name: idType
        description: Security ID type
        in: query
        required: false
        schema:
          type: string
          default: msid
      - name: languageId
        description: Language ID - ISO 639-1
        in: query
        required: false
        schema:
          type: string
      - name: currencyId
        description: Currency ID - ISO 4217 alphabetic code
        in: query
        required: false
        schema:
          type: string
      - name: responseViewFormat
        description: Response view format - xml / json
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
    servers:
    - url: https://www.emea-api.morningstar.com/ecint/v1
      description: PROD
    - url: https://www.emea-uat-api.morningstar.com/ecint/v1
      description: UAT
    - url: https://www.apac-api.morningstar.com/ecint/v1
      description: PROD
    - url: https://www.apac-uat-api.morningstar.com/ecint/v1
      description: UAT
  /securities/{secIds}:
    get:
      tags:
      - Securities
      summary: Get securities data
      description: 'Create response data for the securities specified in the `secIds` parameter. You can specify up to 20 securities. The primary identifier used in the call is the Morningstar security ID. Ticker identifers or CUSIP are also accepted. The value(s) entered appear as the first data point in the output for each security.


        Use the `dataPoints` parameter to specify the data returned in the response. You can enter a data point ID or the corresponding short ID. You can only specify data points your configuration is enabled for.


        To override the default value in the Accept-Language HTTP header, use the `langCult` parameter. You can also define the currency of the data returned. Only one currency can be specified.


        This call works with the `POST /securities/{secIds}` call to create and fetch the data.'
      operationId: Securities_GetSecuritiesDetails
      parameters:
      - name: secIds
        in: path
        description: Unique identifier of a security. Multiple entries must be pipe-separated '|'.
        required: true
        schema:
          type: string
          default: FOUSA06N2B|FEUSA04ABV
      - name: universeIds
        in: query
        description: Unique five-letter identifier created by combining a two-letter Investment Type code and three-letter country code.</br> Multiple entries must be pipe-separated '|'.
        required: false
        schema:
          type: string
          default: FOUSA|FEUSA|FCUSA
      - name: langCult
        in: query
        description: Language and locale, for example, en-US
        required: false
        schema:
          type: string
          default: en-US
      - name: dataPoints
        in: query
        description: Unique identifier of a data point. Can be data point ID or short ID.
        required: false
        schema:
          type: string
          default: n|t
      - name: currencyId
        in: query
        description: ISO 4217 currency code, for example 'USD'
        required: false
        schema:
          type: string
          default: USD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    post:
      tags:
      - Securities
      summary: Create securities data
      description: 'Create response data for the securities specified in the `secIds` parameter. You can specify up to 20 securities. The primary identifier used in the call is the Morningstar security ID. Ticker identifers or CUSIP are also accepted. The value(s) entered appear as the first data point in the output for each security.


        Use the`dataPoints` parameter to specify the data returned in the response. You can enter a data point ID or the corresponding short ID. You can only specify data points your configuration is enabled for.


        To override the default value in the Accept-Language HTTP header, use the `langcult` parameter. You can also define the currency of the data returned. Only one currency can be specified.


        This call works with the `GET /securities/{secIds}` call to create and fetch the data..'
      operationId: Securities_PostSecuritiesDetails
      parameters:
      - name: secIds
        in: path
        description: Unique identifier of a security. Multiple entries must be pipe-separated '|'.
        required: true
        schema:
          type: string
          default: FOUSA06N2B|FEUSA04ABV
      - name: universeIds
        in: query
        description: Unique five-letter identifier created by combining a two-letter Investment Type code and three-letter country code.</br>Multiple entries must be pipe-separated '|'.
        required: false
        schema:
          type: string
          default: FOUSA|FEUSA|FCUSA
      - name: langCult
        in: query
        description: Language and locale, for example, en-US
        required: false
        schema:
          type: string
          default: en-US
      - name: dataPoints
        in: query
        description: Unique identifier of a data point. Can be data point ID or short ID.
        required: false
        schema:
          type: string
          default: n|t
      - name: currencyId
        in: query
        description: ISO 4217 currency code, for example, 'USD'
        required: false
        schema:
          type: string
          default: USD
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecuritiesRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/SecuritiesRequestModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/SecuritiesRequestModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/SecuritiesRequestModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SecuritiesRequestModel'
        description: POST call body. Contains with array of data points and array of securities.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    servers:
    - url: https://www.us-api.morningstar.com/ec/v1/
      description: PROD
    - url: https://www.us-uat-api.morningstar.com/ec/v1/
      description: UAT
  /securities/{secIds}/vabenefits:
    get:
      tags:
      - Securities
      summary: Get benefits data for variable annuity subaccounts
      description: Get benefits data for variable annunity subaccounts for the securities specified in the `secIds` paramter.
      operationId: Securities_Get
      parameters:
      - name: secIds
        in: path
        description: Unique identifier of a security. Multiple entries must be pipe-separated '|'.
        required: true
        schema:
          type: string
          default: VAUSA0N0XD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SecuritiesInputModel'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    servers:
    - url: https://www.us-api.morningstar.com/ec/v1/
      description: PROD
    - url: https://www.us-uat-api.morningstar.com/ec/v1/
      description: UAT
components:
  schemas:
    SecuritiesRequestModel:
      type: object
      properties:
        dataPoints:
          type: string
        securityIds:
          type: string
    SecuritiesInputModel:
      type: object
      properties:
        secIds:
          type: string
        universeIds:
          type: string
        dataPoints:
          type: string
        languageId:
          type: string
        currencyId:
          type: string
        assetAllocationType:
          type: string
        customBenchmark:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-refined-from:
- morningstar-securities-global-openapi.json
- morningstar-securities-us-openapi.json
