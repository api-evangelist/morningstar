          type: string
          description: Refers to additional notes like large text extract for user's further reading
          nullable: true
        guarantorCompanyId:
          type: string
          description: Guarantor company id is the Morning star company ID which represents the guarantor of a fixed income security. Usually fixed income security issued by one company will be guarented by a related company (be it parent or anyother group company)
          nullable: true
        isConvertible:
          type: boolean
          description: 'Indicates if the preferred stock is convertible or not: TRUE denotes the instrument is convertible; otherwise FALSE'
          nullable: true
        isDividendCumulative:
          type: boolean
          description: The flag denotes if the preferred shares has a cumulative dividend feature attached
          nullable: true
        isExchangeable:
          type: boolean
          description: 'Indicates if the preferred stock is exchangeable or not: TRUE denotes the instrument is exchangeable; otherwise FALSE'
          nullable: true
        isRedeemable:
          type: boolean
          description: 'Indicates if the preference stock is redeemable or not: TRUE denotes the preference share is redeemable; otherwise FALSE'
          nullable: true
        isRedeemed:
          type: boolean
          description: The flag that helps denote if the preferred security is active or inactive
          nullable: true
        isSinkFund:
          type: boolean
          description: a flag to indicate if the preferred share will be redeemed through the sinking fund
          nullable: true
        isTrust:
          type: boolean
          description: A flag to indicate if preferred share is trust preferred. TRUE indicates it is Trust Preferred; otherwise FALSE
          nullable: true
        liquidationValue:
          type: number
          description: Liquidation value of Preferred Stock
          format: double
          nullable: true
        maturityDate:
          type: string
          description: The final date on which principal value of preferred stock is expected to be repaid to the holder and the instrument will cease to legally exist
          nullable: true
        paymentSchedule:
