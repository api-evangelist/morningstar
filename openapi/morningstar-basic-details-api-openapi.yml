          nullable: true
        dividendStatus:
          type: string
          description: Indicates if dividend payments occur either at regular/ irregular intervals or even or uneven dividend amount. Possible values are- 1.Regular; 2. Irregular & 3. Stopped. If a Dividend is paid either with irregular frequency or uneven amount; it is marked as 'IrregularSchedule'; whereas if Dividend frequency and Amount both are regular; DividendSchedule is marked as 'Regular.' Stopped is used ifcompany has stopped paying dividend payments going forward.
          nullable: true
        fixedAnnualCoupon:
          type: number
          description: The annual fixed rate of dividend paid on the preferred stock nominal value.
          format: double
          nullable: true
        fixedCouponRate:
          type: number
          description: The fixed rate of dividend paid on the preferred stock nominal value.
          format: double
          nullable: true
        floatingCouponRateCap:
          type: number
          description: This is upper limit to the floating rate dividend of preferred stock.
          format: double
          nullable: true
        floatingCouponRateFloor:
          type: number
          description: This is lower limit to the floating rate dividend of preferred stock.
          format: double
          nullable: true
