            '1': Headquarters
            '2': Registered Office
        description: Address type to filter results by.
        examples:
          addressType1:
            summary: 1 (Headquarters)
            value: 1
          addressType2:
            summary: 2 (Registered Office)
            value: 2
      - name: startDate
        in: query
        schema:
          type: string
          format: yyyy-MM-dd
        description: Time series start date. Accepts `yyyy-MM-dd`.
        examples:
          startDateExample1:
            summary: Example 1
            value: '2025-06-01'
          startDateExample2:
            summary: Example 2
            value: '2025-06-30'
      - name: endDate
        in: query
        schema:
          type: string
          format: yyyy-MM-dd
        description: Time series end date. Accepts `yyyy-MM-dd`.
        examples:
          endDateExample1:
            summary: Example 1
            value: '2025-12-01'
          endDateExample2:
            summary: Example 2
            value: '2025-12-31'
      - name: languageId
        in: query
        description: "\nLanguage to filter results by. Language support varies depending on the data and package.\n\n  - `ENG` = English\n  - `SPA` = Spanish\n  - `FRA` = French\n  - `DEU` = German\n  - `ITA` = Italian\n  - `JPN` = Japanese\n  - `CHI` = Chinese Simplified\n  - `ZHO` = Chinese Traditional\n  - `KOR` = Korean"
        schema:
          type: string
          example: ENG
          x-enumDescriptions:
            ENG: English
            SPA: Spanish
            FRA: French
            DEU: German
            ITA: Italian
            JPN: Japanese
            CHI: Chinese Simplified
            ZHO: Chinese Traditional
            KOR: Korean
        examples:
          languageExample1:
            summary: English
            value: ENG
          languageExample2:
            summary: Spanish
            value: SPA
          languageExample3:
            summary: French
            value: FRA
          languageExample4:
            summary: German
            value: DEU
          languageExample5:
            summary: Italian
            value: ITA
          languageExample6:
            summary: Japanese
            value: JPN
          languageExample7:
            summary: Chinese Simplified
            value: CHI
          languageExample8:
            summary: Chinese Traditional
            value: ZHO
          languageExample9:
            summary: Korean
            value: KOR
      description: "\nThe Basic Details package provides a range of data to round out the company profile, including business descriptions (in a range of languages), details of the advisers to the company, head office and registered office addresses, and the number of employees, alongside details of the IPO, the company’s legal structure, and details of the primary listing of their shares.\nThe package contains the following datasets:\n\n- Advisors\n- Business Description\n- Company Address\n- Company-Level Basic Details\n- Employee Number\n- Preferred Stock Details\n- Preferred Stock Payment Schedule\n- Preferred Stock Redemption Schedule\n- Security-Level Basic Details\n\nMost recent data supported.\n  \n  "
      operationId: getEquityBasicDetailsPackage
      tags:
      - Basic Details
      responses:
        '200':
          $ref: '#/components/responses/ResponseEquityBasicDetails'
        '400':
          $ref: '#/components/responses/ResponseBadRequest'
        '500':
          $ref: '#/components/responses/ResponseInternalServerError'
      x-cpqId: 907
