    OutputProfitabilityPerShare:
      type: object
      properties:
        reportPeriodEndDate:
          type: string
          description: The standardized report date when the company reports its financial statements. Standardized report date will be either 28 or 29 (February); 30 or 31.
          nullable: true
        analystNormalizedEps:
          type: number
          description: The data point represents earnings per share adjusted for income/expenses that are considered irregular; unusual or non-recurring.  The adjustment values are usually reported in the notes to financial statements; management; discussion and analysis or as Non-Gaap metrics.  This is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        currencyCode:
          $ref: '#/components/schemas/CodeMappingString'
        ebitdaPerShare:
          type: number
          description: 'The per share value of earnings before interest; tax; depreciation and amortization expenses (EBITDA). EBITDA: This data point represents the earnings the company generated before interest; tax; depreciation and amortization expenses. This can be used to measure a company''s profitability. This is calculated using EBIT + Depreciation; Amortization and Depletion.'
          format: double
          nullable: true
        ebitdarPerShare:
          type: number
          description: 'The per share value of earnings before interest; tax; depreciation; amortization and rent expenses (EBITDAR). EBITDAR: This data point represents the earnings the company generated before interest; tax; depreciation; amortization and rent expenses. This can be used to measure a company''s profitability. This is calculated using EBITDA + Rent Expenses + Rent and Landing Fees.'
          format: double
          nullable: true
        ebitPerShare:
          type: number
          description: 'The per share value of earnings before interest and tax (EBIT). EBIT: This data point represents the earnings the company generated before paying the interest and tax expenses. This can be used to measure a company''s profitability. This is calculated by using the summation of Pretax Income and Net Interest Income/Expenses.'
          format: double
          nullable: true
        normalizedEbitdaPerShare:
          type: number
          description: 'The per share value of normalized earnings before interest; tax; depreciation and amortization expenses (EBITDA). Normalized EBITDA: This data point represents the earnings the company generated before interest; tax; depreciation and amortization expenses adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to fairly measure a company''s profitability. This is calculated using Earnings Before Interest; Tax; Depreciation and Amortization plus/minus any unusual Items.'
          format: double
          nullable: true
        normalizedEbitdarPerShare:
          type: number
          description: 'The per share value of normalized earnings before interest; tax; depreciation; amortization and rent expenses (EBITDAR). Normalized EBITDAR: This data point represents the earnings the company generated before interest; tax; depreciation; amortization and rent expenses adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to measure a company''s profitability. This is calculated using Earnings Before Interest; Tax; Depreciation; Amortization and Rent expenses plus/minus any unusual Items.'
          format: double
          nullable: true
        normalizedEbitPerShare:
          type: number
          description: 'The per share value of normalized earnings before interest and tax (EBIT). Normalized EBIT: This represents earnings before interest and taxes adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to measure a company''s profitability. This is calculated by using Earnings before Interest and Tax plus/minus any tax affected unusual items.'
          format: double
          nullable: true
        normalizedEps:
          type: number
          description: This data point represents earnings per share adjusted for irregular and/or non-recurring items based on CPMS (Computerized Portfolio Management Services) methodology standards. This is an analyst-screened datapoint.
          format: double
          nullable: true
