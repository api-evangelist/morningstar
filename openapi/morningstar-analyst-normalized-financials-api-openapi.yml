    OutputProfitability:
      type: object
      properties:
        reportPeriodEndDate:
          type: string
          description: The standardized report date when the company reports its financial statements. Standardized report date will be either 28 or 29 (February); 30 or 31.
          nullable: true
        analystNormalizedEbit:
          type: number
          description: This data point represents earnings before interest and taxes adjusted for items that are irregular; unusual in nature; and/or are non-recurring.  This is calculated by using Earnings before Interest and Tax plus/minus any tax affected irregular or unusual items.  EBIT can be used to measure a company's profitability.  This is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        analystNormalizedEbitda:
          type: number
          description: This data point represents the earnings the company generated before interest; tax; depreciation and amortization expenses adjusted for items that are irregular; unusual in nature; and/or are non-recurring.  This is calculated using Earnings Before Interest; Tax; Depreciation and Amortization plus/minus any irregular or unusual Items.  EBITDA can be used to fairly measure a company's profitability. This is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        analystNormalizedEbitdar:
          type: number
          description: This data point represents the earnings the company generated before interest; tax; depreciation; amortization and rent expenses adjusted for items that are irregular; unusual in nature; and/or are non-recurring. This is calculated using Earnings Before Interest; Tax; Depreciation; Amortization and Rent expenses plus/minus any irregular or unusual Items.  EBITDAR can be used to measure a company's profitability. This is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        analystNormalizedNetIncome:
          type: number
          description: This data point represents earnings adjusted for items that are irregular; unusual in nature; and/or are non-recurring.  This can be used to fairly measure a company's profitability.  This is calculated using Net Income from Continuing Operations plus/minus any tax affected unusual Items and Goodwill Impairments/Write Offs.  This is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        bookValueToEbitdaRatio:
          type: number
          description: This ratio represents the value of a company's book value relative to its EBITDA. This can be used to determine a company's fair value when comparing this ratio among different companies within the same sector. This is calculated using Book Value divided by EBITDA (TTM).
          format: double
          nullable: true
        bookValueToEbitRatio:
          type: number
          description: This ratio represents the value of a company's book value relative to its EBIT. This can be used to determine a company's fair value when comparing this ratio among different companies within the same sector. This is calculated using Book Value divided by EBIT (TTM).
          format: double
          nullable: true
        bookValueToNetIncomeRatio:
          type: number
          description: This ratio represents the value of a company's book value relative to its net income. This can be used to determine a company's fair value when comparing this ratio among different companies within the same sector. This is calculated using Book Value divided by Net Income (TTM).
          format: double
          nullable: true
        bookValueToRevenueRatio:
          type: number
          description: This ratio represents the value of a company's book value relative to its revenue. This can be used to determine a company's fair value when comparing this ratio among different companies within the same sector. This is calculated using Book Value divided by Revenue (TTM).
          format: double
          nullable: true
        currencyCode:
          $ref: '#/components/schemas/CodeMappingString'
        earningsBeforeInterestAndTax:
          type: number
          description: This data point represents the earnings the company generated before paying interest and tax expenses. This can be used to measure a company's profitability. This is calculated by using the summation of Pretax Income and Net Interest Income/Expenses.
          format: double
          nullable: true
        earningsBeforeInterestTaxAndAmortization:
          type: number
          description: This data point represents the earnings the company generated before interest; tax and amortization expenses. This can be used to measure a company's profitability. This is calculated using Earnings Before Interest; Tax; Depreciation and Amortization minus Depreciation.
          format: double
          nullable: true
        earningsBeforeInterestTaxDepreciationAmortizationAndRent:
          type: number
          description: This data point represents the earnings the company generated before interest; tax; depreciation; amortization and rent expenses. This can be used to measure a company's profitability. This is calculated using EBITDA + Rent Expenses + Rent and Landing Fees.
          format: double
          nullable: true
        earningsBeforeInterestTaxDepreciationAndAmortization:
          type: number
          description: This data point represents the earnings the company generated before interest; tax; depreciation and amortization expenses. This can be used to measure a company's profitability. This is calculated using EBIT + Depreciation; Amortization and Depletion.
          format: double
          nullable: true
        freeCashFlowToAssetsRatio:
          type: number
          description: This ratio represents the value of a company's free cash flow relative to its total assets. This can be used to measure a company's ability to transfer each dollar worth of assets into cash. This is calculated using the Free Cash Flow (TTM) divided by Average Total Assets.
          format: double
          nullable: true
        freeCashFlowToEquityRatio:
          type: number
          description: This ratio represents the value of a company's free cash flow relative to its total equity. This can be used to measure the amount of cash available for distribution for each dollar worth of equity. This is calculated using the Free Cash Flow (TTM) divided by Average Total Equity.
          format: double
          nullable: true
        freeCashFlowToNetIncomeRatio:
          type: number
          description: This ratio represents the value of a company's free cash flow relative to its net income. This can be used to measure a company's ability to transfer each dollar worth of earnings into cash. This is calculated using the Free Cash Flow divided by Net Income.
          format: double
          nullable: true
        freeCashFlowToSalesRatio:
          type: number
          description: This ratio represents the value of a company's free cash flow relative to its total revenue. This can be used to measure a company's ability to convert each dollar worth of revenue into cash. This is calculated using the Free Cash Flow divided by Total Revenue.
          format: double
          nullable: true
        netOperatingProfitAfterTax:
          type: number
          description: This calculation represents the tax affected operating earnings the company generated for the period. This can be used to measure a company's profitability. This is calculated using Net Income from Continuing Operations plus tax affected Net Interest Income/Expense minus tax affected Dividend and Investment Income.
          format: double
          nullable: true
        normalizedEarningsBeforeInterestAndTax:
          type: number
          description: This represents earnings before interest and taxes adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to measure a company's profitability. This is calculated by using Earnings before Interest and Tax plus/minus any tax affected unusual items.
          format: double
          nullable: true
        normalizedEarningsBeforeInterestTaxDepreciationAmortizationAndRent:
          type: number
          description: This data point represents the earnings the company generated before interest; tax; depreciation; amortization and rent expenses adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to measure a company's profitability. This is calculated using Earnings Before Interest; Tax; Depreciation; Amortization and Rent expenses plus/minus any unusual Items.
          format: double
          nullable: true
        normalizedEarningsBeforeInterestTaxDepreciationAndAmortization:
          type: number
          description: This data point represents the earnings the company generated before interest; tax; depreciation and amortization expenses adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to fairly measure a company's profitability. This is calculated using Earnings Before Interest; Tax; Depreciation and Amortization plus/minus any unusual Items.
          format: double
          nullable: true
        normalizedIncome:
          type: number
          description: This calculation represents earnings adjusted for items that are irregular or unusual in nature; and/or are non-recurring. This can be used to fairly measure a company's profitability. This is calculated using Net Income from Continuing Operations plus/minus any tax affected unusual Items and Goodwill Impairments/Write Offs.
          format: double
          nullable: true
        normalizedReturnOnAsset:
          type: number
          description: This ratio represents the value of a company's normalized income relative to its total assets. This can be used to measure the company's ability to utilize its assets efficiently to generate earnings from its normal operations. This is calculated using Normalized Income (TTM) divided by Average Total Assets.
          format: double
          nullable: true
        normalizedReturnOnEquity:
          type: number
          description: This ratio represents the value of a company's normalized income relative to its total equity. This can be used to measure the company's ability to utilize its equity efficiently to generate earnings from its normal operations. This is calculated using Normalized Income (TTM) divided by Average Total Equity.
          format: double
          nullable: true
        normalizedReturnOnInvestedCapital:
          type: number
          description: This ratio represents the value of a company's normalized net operating profit after tax relative to its Invested Capital. This can be used to measure the company's ability to utilize its invested capital efficiently to generate earnings from its normal operations. This is calculated using Normalized Net operating profit after tax (TTM) divided by Invested Capital.
          format: double
          nullable: true
        returnOnAsset:
          type: number
          description: This ratio represents the value of a company's net income relative to its total assets. This can be used to determine how much profit a company generates on its asset base. This is calculated using Net Income from Continuing Operations (TTM) divided by Average Total Assets.
          format: double
          nullable: true
        returnOnCapitalEmployed:
          type: number
          description: This ratio represents the value of a company's earnings before interest and tax (EBIT) relative to its Capital Employed. This can be used to measure how much profit a company generates on its capital base. This is calculated using Earnings Before Interest and Tax (EBIT) (TTM); divided by Average Total Assets minus Average Current Liabilities
          format: double
          nullable: true
        returnOnEquity:
          type: number
          description: This ratio represents the value of a company's net income relative to its total equity. This can be used to determine how much profit a company generates on the money shareholders have invested in the firm. This is calculated using Net Income from Continuing Operations (TTM) divided by Average Total Equity
          format: double
          nullable: true
        returnOnInvestedCapital:
          type: number
          description: This ratio represents the value of a company's net operating profit after tax relative to its Invested Capital. This can be used to measure how much profit a company generates on its capital base. This is calculated using Net operating profit after tax (TTM) divided by Invested Capital.
          format: double
          nullable: true
        returnOnNetOperatingAssets:
          type: number
          description: This ratio represents the value of a company's net income relative to its net operating assets. This can be used to determine how much profit a company generates on its asset base. This is calculated using Net Income from Continuing Operations (TTM) divided by Average Net Operating Assets.
          format: double
          nullable: true
        numberOfMonths:
          type: integer
          description: ''
          format: int32
          nullable: true
        reportPeriod:
          type: string
          description: ''
          nullable: true
        reportType:
          type: string
          description: ''
          nullable: true
      additionalProperties: false
      title: OutputProfitability
    OutputEnterpriseValueCalculations:
      type: object
      properties:
        asOfDate:
          type: string
          description: The calendar date when enterprise value data points are calculated
          nullable: true
        analystNormalizedEnterpriseValueToEbitdaRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its Normalized EBITDA.  The ratio can be used to measure a company's fair value.  This is calculated using Enterprise Value divided by Normalized EBITDA which is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        analystNormalizedEnterpriseValueToEbitRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its Normalized EBIT.  The ratio can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Normalized EBIT; which is an analyst-screened datapoint; meaning an analyst is identifying and taking judgment on what should or should not be adjusted.
          format: double
          nullable: true
        cashReturn:
          type: number
          description: This ratio represents a company's free cash flow relative to its enterprise value. This can be used to measure how efficiently the company is using its capital; both equity and debt; to generate free cash flow. In other words; cash return shows how much free cash flow a company generates as a percentage of how much it would cost an investor to buy out the entire business. This is calculated using Free Cash Flow to Firm divided by Enterprise Value.
          format: double
          nullable: true
        currencyCode:
          $ref: '#/components/schemas/CodeMappingString'
        enterpriseValue:
          type: number
          description: This calculations represents the entire value of a company. This can be used to measure a company's theoretical purchase price. This is calculated using Market Cap + Preferred Stock/Units + Non-Controlling/Minority Interests in Equity + Net Debt.
          format: double
          nullable: true
        enterpriseValueIncludingCash:
          type: number
          description: This calculations represents the entire value of a company. This can be used to measure a company's theoretical purchase price. This is calculated using Market Capital + Total Preferred Stock/Units/Securities + Non-Controlling/Minority Interests in Equity + Total Debt
          format: double
          nullable: true
        enterpriseValueToAssetsRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its total assets. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Total Assets.
          format: double
          nullable: true
        enterpriseValueToEbitdaRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its EBITDA. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by EBITDA (TTM).
          format: double
          nullable: true
        enterpriseValueToEbitRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its EBIT. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by EBIT (TTM).
          format: double
          nullable: true
        enterpriseValueToFreeCashFlowRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its free cash flow. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Free Cash Flow (TTM).
          format: double
          nullable: true
        enterpriseValueToPretaxIncomeRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its pre-tax income. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Pre-Tax Income (TTM).
          format: double
          nullable: true
        enterpriseValueToRevenueRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to revenue. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Total Revenue (TTM).
          format: double
          nullable: true
        normalizedEnterpriseValueToEbitdaRatio:
          type: number
          description: This ratio represents the value of a company's enterprise value relative to its Normalized EBITDA. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Normalized EBITDA (TTM).
          format: double
          nullable: true
        normalizedEnterpriseValueToEbitRatio:
          type: number
          description: This ratio represents a company's enterprise value relative to its Normalized EBIT. This can be used to measure a company's fair value. This is calculated using Enterprise Value divided by Normalized EBIT (TTM).
          format: double
          nullable: true
        totalDebtToEnterpriseValue:
          type: number
          description: This ratio represents the value of a company's total debt relative to its enterprise value. This can be used to measure the company's financial leverage. This is calculated using Total Debt divided by Enterprise Value.
          format: double
          nullable: true
      additionalProperties: false
      title: OutputEnterpriseValueCalculations
    OutputMetadata:
      type: object
      properties:
        requestId:
          type: string
          nullable: true
        time:
          type: string
          format: date-time
          readOnly: true
        portfolioDate:
          type: string
          nullable: true
        portfolioCurrency:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutputMetadataMessages'
          nullable: true
      additionalProperties: false
      title: OutputMetadata
    OutputErrorDetails:
      type: object
      properties:
        statusCode:
          type: integer
          description: Status Code
          format: int32
