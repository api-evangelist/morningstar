                    example: An error occurred
    put:
      tags:
      - company entitlements
      summary: Overwrite a company entitlement
      description: Overwrite the company entitlement specified by the `entitlementId` parameter. The namespaces listed in the request body will replace the current namespaces for this entitlement. The `companyId` for this entitlement will not be updated.
      operationId: UpdateEntitlement
      parameters:
      - name: entitlementId
        description: Unique identifier of an entitlement
        in: path
        required: true
        schema:
          type: string
          example: 1fa234a-5678-9d1d-0c11-x1y2131zf4d1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - properties:
                  entitlementId:
                    type: string
                    readOnly: true
                    example: 1fa234a-5678-9d1d-0c11-x1y2131zf4d1
                  companyId:
                    type: string
                    readOnly: false
                    example: 1234aeaf-4321-1a23-1234-23gf5c663g24
                  namespaces:
                    type: array
                    description: List of authorised namespaces
                    items:
                      type: string
                    example:
                    - namespace1
                    - namespace2
              - properties:
                  companyId:
                    readOnly: true
      responses:
        '200':
          description: An entitlement object
          content:
            application/json:
              schema:
                properties:
                  entitlementId:
                    type: string
                    readOnly: true
                    example: 1fa234a-5678-9d1d-0c11-x1y2131zf4d1
                  companyId:
