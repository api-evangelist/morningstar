            value: '2025-12-31'
      description: '

        The Governance package provides data relating to the executive leadership and board of directors of the companies. Global coverage includes the names and job titles of these individuals plus, for companies with shares listed on exchanges in the United States, and United Kingdom, biographical data and enhanced data relating to their tenure, meeting attendance, and committee membership.

        The Governance package contains the following datasets:

        Board and Committee Attendance

