openapi: 3.2.0
info:
  title: Optical Character Recognition statement details API
  description: The Optical Character Recognition API enables you to extract information from portfolio statements that are formatted as PDFs or images.
  version: 1.0.0
servers:
- url: ' https://www.us-api.morningstar.com/optical-character-recognition/v1'
security:
- bearerAuth: []
tags:
- name: statement details
paths:
  /statement-details:
    post:
      tags:
      - statement details
      summary: Extract statement details
      description: 'Extract portfolio statement information from the base64-encoded PDF/image sent in the request. Information is extracted based on the logic defined, where available, for the custodian specified in the `documentShortName` or `documentName` values in the request body.


        The request supports the following file types:


        -JPG

        -JPEG

        - PNG

        - PDF


        When sending a PDF, you can specify the page numbers to extract information from. For example, `1,3,6,9` or `1,3,6,8-11`. If you do not specify `pageNumbers` values, the whole document will be considered. If you pass a `0` value, it will be considered as `1`. When specifying a range, for example `8-11`, the first number must be smaller than the second number.


        The response contains an `id` which you use to retrieve the results of the request. The `id` can also be used to track the request.'
      parameters:
      - name: Accept-Language
        in: header
        description: Language and locale
        schema:
          type: string
          enum:
          - en-US
          - en-CA
          - fr-CA
      requestBody:
        content:
          application/json:
            schema:
              required:
              - fileName
              - pageNumbers
              - documentType
              - documentName
              - documentShortName
              - data
              type: object
              properties:
                fileName:
                  type: string
                  description: Name of file used to store image/pdf object
                pageNumbers:
                  type:
                  - string
                  - 'null'
                  description: Comma-separated list of PDF page numbers to process
                documentType:
                  type: string
                  description: Document type. Currently supports 'CUSTODIAN' only.
                documentName:
                  type: string
                  description: Custodian name (label) from custodian list
                documentShortName:
                  type: string
                  description: Short name of a custodian. If not present, passes to 'DEFAULT'.
                  default: DEFAULT
                data:
                  type: string
                  description: Base64-encoded image/pdf file
                  format: byte
            encoding:
              fileName:
                style: form
              pageNumbers:
                style: form
              documentType:
                style: form
              documentName:
                style: form
              documentShortName:
                style: form
              data:
                style: form
      responses:
        '202':
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      operationId: postStatementDetails
      x-operation-id-source: derived
  /statement-details/{id}:
    get:
      tags:
      - statement details
      summary: Get statement details
      description: 'Get the portfolio statement information extracted by the `POST /statement-details` request.


        The unique job ID returned by the POST request is automatically included in this GET request''s URL.


        The response contains a JSON obect with an array of security details such as ticker, name, market value, and so on.'
      parameters:
      - name: id
        in: path
        description: Unique identifier of request
        required: true
        schema:
          type: string
          description: abc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                example:
                  jobId: a44fa75bd070402f9ae92b60397049a11615377437152
        '400':
          description: Bad Request
        '404':
          description: Resource you requested is not found.
        '500':
          description: Internal Server Error
      operationId: getStatementDetailsById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
