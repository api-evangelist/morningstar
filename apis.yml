  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.morningstar.com/apis/market-data/overview
  properties:
  - url: https://developer.morningstar.com/content/apis/market-data/overview/api-md-apis-overview.md
    type: Documentation
  - url: https://developer.morningstar.com/content/apis/market-data/price-quote/api-md-price-quotes.md
    type: Documentation
  - url: https://developer.morningstar.com/content/apis/market-data/time-sales/api-md-time-sales.md
    type: Documentation
  - url: https://developer.morningstar.com/content/apis/market-data/end-of-day-ohlcv/api-md-eod-ohlcv.md
