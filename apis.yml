aid: morningstar
url: https://raw.githubusercontent.com/api-evangelist/morningstar/refs/heads/main/apis.yml
name: Morningstar
kind: company
description: Morningstar, Inc. (Nasdaq MORN) is a Chicago-based investment research and financial market
  data company selling fund and equity data, analyst research, ratings, indexes, and portfolio analytics
  to advisors, asset managers, and fintechs. Its developer portal at developer.morningstar.com documents
  two large API families - Direct Web Services and Dynamic Services APIs - delivered as regional REST
  bases (us/emea/apac-api.morningstar.com) secured with OAuth 2.0 tokens, plus a Market Data Web Services
  API for real-time, delayed, and end-of-day pricing, a WebSocket Streaming API for Level 1/Level 2 market
  data, ByAllAccounts account aggregation, and an emerging MCP/agent surface. Documentation and OpenAPI
  3.x specs are fully public, but credentials are sales-gated through Morningstar onboarding - there is
  no self-serve signup. Morningstar remains an independent public company and owns PitchBook, DBRS (credit
  ratings), and ByAllAccounts.
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
  confidence: medium
  source:
  - authentication
  generated: '2026-07-22'
  method: derived
