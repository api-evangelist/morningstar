details:
  token_issuance: POST /token/oauth on the regional base (us/emea/apac-api.morningstar.com) with Basic
    Base64 username:password returns an unscoped bearer access token.
  token_ttl_minutes: 60
  token_cache_note: Requests within ten minutes of issuance return the same cached token.
  credential_provisioning: Sales-gated - usernames/passwords are provisioned during Morningstar onboarding;
    no self-serve signup.
  market_data_note: Market Data Web Services uses IP-allowlisted username/password on client-specific
    servers.
  mcp_oauth: The MCP server at mcp.morningstar.com runs a full OAuth 2.0 authorization server with PKCE
    (S256) and dynamic client registration - see well-known/morningstar-oauth-authorization-server.json
    and scopes/morningstar-scopes.yml.
