- name: morningstar-data-tool
  description: Retrieves Morningstar's AI-ready data for global mutual funds, ETFs, and stocks.
- name: morningstar-fund-holdings-tool
  description: Retrieves the top holdings for a list of mutual funds or ETFs.
- name: morningstar-id-lookup-tool
